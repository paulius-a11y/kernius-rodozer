<title>Kernius Rodžer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap');

:root {
  --bg: #0e0e0e; --card: #1c1c1e; --border: #2c2c2e;
  --green: #00e676; --red: #ff453a; --amber: #ffd60a;
  --blue: #0a84ff; --pink: #ff375f; --text: #ffffff;
  --muted: #8e8e93; --r: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; overscroll-behavior: none; }

.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }

.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
.back-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: none; color: var(--text); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.back-btn:active { background: #333; }
.topbar-title { font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 3px; }
.topbar-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }
.clock { margin-left: auto; font-size: 14px; color: var(--amber); flex-shrink: 0; font-family: 'Oswald', sans-serif; }

.report-list { flex: 1; overflow-y: auto; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 10px; }
.rep-btn { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; width: 100%; }
.rep-btn:active { opacity: 0.7; }
.rep-icon { width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; }
.rep-text { flex: 1; }
.rep-code { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; margin-bottom: 3px; }
.rep-desc { font-size: 11px; color: var(--muted); line-height: 1.6; }
.rep-arrow { color: var(--muted); font-size: 20px; }
.ic-red   { background: rgba(255,69,58,.18);  color: var(--red); }
.ic-amber { background: rgba(255,214,10,.15); color: var(--amber); }
.ic-green { background: rgba(0,230,118,.15);  color: var(--green); }
.ic-pink  { background: rgba(255,55,95,.18);  color: var(--pink); }
.ic-blue  { background: rgba(10,132,255,.18); color: var(--blue); }
.bl-red   { border-left: 3px solid var(--red); }
.bl-amber { border-left: 3px solid var(--amber); }
.bl-green { border-left: 3px solid var(--green); }
.bl-pink  { border-left: 3px solid var(--pink); }
.bl-blue  { border-left: 3px solid var(--blue); }

.progress-wrap { padding: 10px 16px 0; flex-shrink: 0; }
.progress-track { height: 3px; background: var(--border); border-radius: 2px; }
.progress-fill  { height: 3px; border-radius: 2px; transition: width 0.3s ease; }
.progress-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 5px; text-align: right; }

.step-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.step-card { background: var(--card); border-radius: var(--r); border: 1px solid var(--border); flex-shrink: 0; }
.step-card-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.step-letter { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; width: 36px; text-align: center; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.step-label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.step-value { font-size: 15px; color: var(--text); word-break: break-word; }
.step-value.empty { color: var(--muted); font-size: 13px; }

.opts-grid { display: grid; gap: 8px; padding: 12px 14px 14px; grid-template-columns: 1fr 1fr; }
.opts-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.opts-grid.cols1 { grid-template-columns: 1fr; }

.opt-btn { background: #252525; border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 8px; font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--text); cursor: pointer; text-align: center; line-height: 1.3; min-height: 50px; display: flex; align-items: center; justify-content: center; }
.opt-btn:active { background: #333; }
.opt-btn.selected { border-color: var(--accent, #fff); background: rgba(255,255,255,0.07); }

.gps-btn { margin: 0 14px 12px; width: calc(100% - 28px); background: rgba(10,132,255,0.15); border: 1.5px solid var(--blue); border-radius: 10px; padding: 14px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--blue); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.gps-btn:active { background: rgba(10,132,255,0.3); }
.gps-btn.loading { opacity: 0.6; }
.gps-btn.success { background: rgba(0,230,118,0.15); border-color: var(--green); color: var(--green); font-size: 12px; }

.free-input-wrap { padding: 0 14px 14px; }
.free-input { width: 100%; background: #252525; border: 1.5px solid var(--border); border-radius: 10px; color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 15px; padding: 13px 14px; outline: none; resize: none; min-height: 50px; }
.free-input:focus { border-color: #666; }
.free-input::placeholder { color: #555; font-size: 13px; }

.nav-bar { padding: 12px 16px 20px; display: flex; gap: 10px; flex-shrink: 0; background: var(--bg); border-top: 1px solid var(--border); }
.btn-prev { width: 52px; height: 52px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-prev:active { background: #333; }
.btn-prev:disabled { opacity: 0.25; }
.btn-next { flex: 1; height: 52px; border-radius: 12px; background: var(--green); border: none; font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 3px; color: #000; cursor: pointer; }
.btn-next:active { opacity: 0.85; }
.btn-next.last { background: var(--amber); color: #000; }

.summary-list { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.sum-row { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 10px; padding: 10px 14px; border: 1px solid var(--border); cursor: pointer; }
.sum-row:active { background: #252525; }
.sum-ltr { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; width: 22px; flex-shrink: 0; }
.sum-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.sum-val { font-size: 12px; color: var(--text); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-val.empty { color: var(--muted); font-style: italic; }
.sum-edit { margin-left: auto; font-size: 12px; color: var(--muted); flex-shrink: 0; }

.preview-body { flex: 1; overflow-y: auto; padding: 16px; }
.preview-box { background: var(--card); border-radius: var(--r); border: 1px solid var(--border); padding: 18px; font-size: 15px; line-height: 2; color: var(--green); white-space: pre-wrap; margin-bottom: 10px; }
.preview-meta { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-align: center; margin-bottom: 16px; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action-btn { border-radius: 12px; padding: 20px 10px; border: none; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.action-btn:active { opacity: 0.8; }
.action-btn .icon { font-size: 26px; }
.action-btn.sms  { background: var(--amber); color: #000; }
.action-btn.copy { background: #1e2e24; color: var(--green); border: 1px solid var(--green); }
.action-btn.edit { background: var(--card); color: var(--muted); border: 1px solid var(--border); font-size: 12px; }
.action-btn.new  { background: var(--card); color: var(--muted); border: 1px solid var(--border); font-size: 12px; }

.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--green); color: #000; padding: 12px 28px; border-radius: 30px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 3px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; }
</style>

<script>
// Lightweight WGS84 -> MGRS conversion
(function(global){
  var NUM_100K_SETS=6, SET_ORIGIN_COLUMN_LETTERS='AJSAJS', SET_ORIGIN_ROW_LETTERS='AFAFAF';
  var A=65,I=73,O=79,V=86,Z=90;
  function get100kSetForZone(i){var s=i%NUM_100K_SETS;return s===0?NUM_100K_SETS:s;}
  function getLetter100kID(column,row,parm){
    var index=parm-1,colInt=SET_ORIGIN_COLUMN_LETTERS.charCodeAt(index),rowInt=SET_ORIGIN_ROW_LETTERS.charCodeAt(index),colInt=colInt+column-1,roundUp=false;
    if(colInt>Z){colInt=colInt-Z+A-1;roundUp=true;}
    if(colInt===I||(colInt>I&&roundUp)){colInt++;}
    if(colInt===O||(colInt>O&&roundUp)){colInt++;if(colInt===I)colInt++;}
    if(colInt>Z){colInt=colInt-Z+A-1;}
    var rowInt=rowInt+row;
    while(rowInt>V){rowInt=rowInt-V+A-1;if(rowInt===I)rowInt++;if(rowInt===O)rowInt++;}
    if(rowInt===I)rowInt++;if(rowInt===O)rowInt++;
    return String.fromCharCode(colInt)+String.fromCharCode(rowInt);
  }
  function encode(utm,accuracy){
    var seasting='00000'+utm.easting,snorthing='00000'+utm.northing;
    return utm.zoneNumber+utm.zoneLetter+getLetter100kID(
      Math.floor(utm.easting/100000),Math.floor((utm.northing%2000000)/100000),
      get100kSetForZone(utm.zoneNumber)
    )+(seasting.substr(seasting.length-5)).substr(0,accuracy)+(snorthing.substr(snorthing.length-5)).substr(0,accuracy);
  }
  function latLonToUtm(lat,lon){
    var Lat=lat,Long=lon,a=6378137.0,eccSquared=0.00669438,k0=0.9996;
    var LongOrigin,eccPrimeSquared,N,T,C,A2,M;
    var LatRad=Lat*Math.PI/180,LongRad=Long*Math.PI/180;
    var ZoneNumber=Math.floor((Long+180)/6)+1;
    if(Lat>=56.0&&Lat<64.0&&Long>=3.0&&Long<12.0)ZoneNumber=32;
    if(Lat>=72.0&&Lat<84.0){if(Long>=0.0&&Long<9.0)ZoneNumber=31;else if(Long>=9.0&&Long<21.0)ZoneNumber=33;else if(Long>=21.0&&Long<33.0)ZoneNumber=35;else if(Long>=33.0&&Long<42.0)ZoneNumber=37;}
    LongOrigin=(ZoneNumber-1)*6-180+3;
    var LongOriginRad=LongOrigin*Math.PI/180;
    eccPrimeSquared=eccSquared/(1-eccSquared);
    N=a/Math.sqrt(1-eccSquared*Math.sin(LatRad)*Math.sin(LatRad));
    T=Math.tan(LatRad)*Math.tan(LatRad);C=eccPrimeSquared*Math.cos(LatRad)*Math.cos(LatRad);
    A2=Math.cos(LatRad)*(LongRad-LongOriginRad);
    M=a*((1-eccSquared/4-3*eccSquared*eccSquared/64-5*eccSquared*eccSquared*eccSquared/256)*LatRad-(3*eccSquared/8+3*eccSquared*eccSquared/32+45*eccSquared*eccSquared*eccSquared/1024)*Math.sin(2*LatRad)+(15*eccSquared*eccSquared/256+45*eccSquared*eccSquared*eccSquared/1024)*Math.sin(4*LatRad)-(35*eccSquared*eccSquared*eccSquared/3072)*Math.sin(6*LatRad));
    var UTMEasting=k0*N*(A2+(1-T+C)*A2*A2*A2/6+(5-18*T+T*T+72*C-58*eccPrimeSquared)*A2*A2*A2*A2*A2/120)+500000.0;
    var UTMNorthing=k0*(M+N*Math.tan(LatRad)*(A2*A2/2+(5-T+9*C+4*C*C)*A2*A2*A2*A2/24+(61-58*T+T*T+600*C-330*eccPrimeSquared)*A2*A2*A2*A2*A2*A2/720));
    if(Lat<0)UTMNorthing+=10000000.0;
    var ZoneLetter='CDEFGHJKLMNPQRSTUVWXX'.charAt(Math.floor((Lat+80)/8));
    return{northing:Math.round(UTMNorthing),easting:Math.round(UTMEasting),zoneLetter:ZoneLetter,zoneNumber:ZoneNumber};
  }
  global.latLonToMGRS=function(lat,lon,precision){
    precision=precision||5;
    return encode(latLonToUtm(lat,lon),precision);
  };
})(window);
</script>
</head>

<div class="screen active" id="screen-select">
  <div class="topbar">
    <div><div class="topbar-title">KERNIUS RODŽER</div><div class="topbar-sub">📡 PASIRINK SITUACIJĄ</div></div>
    <div class="clock" id="clock">00:00</div>

  <div class="report-list">
    <button class="rep-btn bl-red" onclick="startReport('contactrep')">
      <div class="rep-icon ic-red">!</div>
      <div class="rep-text"><div class="rep-code" style="color:var(--red)">CONTACTREP</div><div class="rep-desc">Kontaktas su priešu · pirmoji sekundė<br>Kryptis · Atstumas · Aprašymas</div></div>

      <div class="rep-text"><div class="rep-code" style="color:var(--amber)">SALUTO</div><div class="rep-desc">Priešo stebėjimas · žvalgyba<br>Dydis · Veikla · Vieta · Įranga</div></div>
      <div class="rep-arrow">›</div>

<script>
const UNITS = ['CHARLI 1','CHARLI 2','CHARLI 3','DELTA 1','DELTA 2','DELTA 3'];

const REPORTS = {
  contactrep: {
    title:'CONTACTREP', sub:'KONTAKTAS · 3D', color:'var(--red)',
    fields:[
      { key:'time',   letter:'⏱', label:'LAIKAS',        hint:'HH:MM', opts:['DABAR'], free:true },
      { key:'unit',   letter:'◈', label:'MANO VIENETAS', hint:'', opts:UNITS, free:false, cols:2 },
      { key:'dir',    letter:'K', label:'KRYPTIS',        hint:'', opts:['ŠIAURĖ','ŠR','RYTAI','PR','PIETŪS','PV','VAKARAI','ŠV'], free:true, cols:3 },
      { key:'dist',   letter:'A', label:'ATSTUMAS',       hint:'pvz. 200m', opts:['50m','100m','200m','300m','500m','1km'], free:true, cols:3 },

      { key:'action', letter:'▶', label:'MŪSŲ VEIKSMAS', hint:'', opts:['KOVOJAME','TRAUKIAMĖS','GYNYBOJE','PERSIGRUPUOJAME'], free:false, cols:2 },
    ],
    build: f=>`CONTACTREP · ${f.time||'?'} · ${f.unit||'?'}\nKRYPTIS: ${f.dir||'?'}\nASTUMAS: ${f.dist||'?'}\nPRIEŠAS: ${f.desc||'?'}\nVEIKSMAS: ${f.action||'?'}\nPABAIGA.`
  },
  saluto:{
    title:'SALUTO', sub:'PRIEŠO ŽVALGYBA', color:'var(--amber)',
    fields:[
      { key:'time',     letter:'⏱', label:'LAIKAS',   hint:'HH:MM', opts:['DABAR'], free:true },
      { key:'unit',     letter:'◈', label:'VIENETAS', hint:'', opts:UNITS, free:false, cols:2 },
      { key:'size',     letter:'S', label:'DYDIS',    hint:'', opts:['1–2','3–5','6–10','10+','Su transportu','Su šarvuočiu'], free:true, cols:3 },
      { key:'activity', letter:'A', label:'VEIKLA',   hint:'', opts:['Juda į priekį','Gynyboje','Stovi','Traukiasi','Stato blokpostą','Neaiški'], free:true, cols:2 },
      { key:'loc',      letter:'L', label:'VIETA',    hint:'koordinatės / orientyras', opts:[], free:true, gps:true },
      { key:'equip',    letter:'O', label:'GINKLAI',  hint:'', opts:['AK','PKM','SVD','RPG','UAZ','Šarvuotis','Nematyta'], free:true, cols:3 },
      { key:'unit_e',   letter:'U', label:'PADALINYS',hint:'', opts:['Nežinoma','Be ženklų','Su uniforma','Civiliai'], free:false, cols:2 },
    ],
    build: f=>`SALUTO · ${f.time||'?'} · ${f.unit||'?'}\nDYDIS: ${f.size||'?'}\nVEIKLA: ${f.activity||'?'}\nVIETA: ${f.loc||'?'}\nĮRANGA: ${f.equip||'?'}\nPADALINYS: ${f.unit_e||'nežinoma'}\nPABAIGA.`
  },
  lace:{
    title:'LACE', sub:'RESURSŲ ATASKAITA', color:'var(--green)',
    fields:[
      { key:'unit_t',     letter:'◈', label:'VIENETAS · LAIKAS', hint:'', opts:UNITS, free:true, cols:2 },
      { key:'liquid',     letter:'L', label:'VANDUO',            hint:'', opts:['Pilnas ✓','75%','50%','25%','Kritiškai mažai'], free:false, cols:2 },
      { key:'ammo',       letter:'A', label:'ŠAUDMENYS',         hint:'', opts:['Pilni ✓','75%','50%','25%','Kritiškai mažai'], free:false, cols:2 },

      { key:'loc',         letter:'①', label:'VIETA (koordinatės)',      hint:'pvz. MB341289', opts:[], free:true, gps:true },
      { key:'radio',       letter:'②', label:'RADIJAS + ŠAUKL. ŽENKLAS',hint:'pvz. 46.250 / ALFA', opts:[], free:true },
      { key:'patients',    letter:'③', label:'PACIENTAI',               hint:'', opts:['1×A (urgent)','1×B (priority)','1×C (routine)','2×A','1×A 1×B'], free:true, cols:2 },
      { key:'equip',       letter:'④', label:'SPEC. ĮRANGA',            hint:'', opts:['Nereikia','Neštuvai','Kab. neštuvos','Deguonis'], free:false, cols:2 },
      { key:'mobility',    letter:'⑤', label:'PACIENTŲ JUDUMAS',        hint:'', opts:['Einantis (D)','Neštuvai (E)','1×D 1×E'], free:false, cols:2 },
      { key:'security',    letter:'⑥', label:'SAUGUMAS VIETOJE',        hint:'', opts:['N – nėra priešo','P – galimas','X – aktyvi ugnis','K – nereikia eskortos'], free:false, cols:1 },
      { key:'lz',          letter:'⑦', label:'LZ ŽYMĖJIMAS',            hint:'', opts:['Violetiniai dūmai','Raudoni dūmai','Žali dūmai','Strobe','VS-17'], free:false, cols:2 },
      { key:'nationality', letter:'⑧', label:'PILIETYBĖ',               hint:'', opts:['A – savos','B – sąjungininkai','C – civiliai','D – priešo'], free:false, cols:2 },
      { key:'injury',      letter:'⑨', label:'TRAUMA',                  hint:'pvz. GSW šlaunis', opts:['GSW','Sprogimo trauma','Lūžis','Nusvilimas','Alpimas/šokas'], free:true, cols:3 },

let currentId=null, currentStep=0, formData={}, accentColor='var(--green)';

function goTo(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
}

function startReport(id){
  currentId=id; currentStep=0; formData={};
  const r=REPORTS[id]; accentColor=r.color;
  document.getElementById('form-title').textContent=r.title;
  document.getElementById('form-sub').textContent=r.sub;
  const tf=r.fields.find(f=>f.key==='time');
  if(tf) formData['time']=new Date().toTimeString().slice(0,5);
  renderStep(); goTo('form');
}

function renderStep(){
  const r=REPORTS[currentId], fields=r.fields, total=fields.length, i=currentStep, f=fields[i];

  document.getElementById('prog-fill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-fill').style.background=accentColor;
  document.getElementById('prog-label').textContent=(i+1)+' / '+total;

  const prevBtn=document.getElementById('btn-prev'), nextBtn=document.getElementById('btn-next');
  prevBtn.disabled=(i===0);
  nextBtn.textContent=i===total-1?'GENERUOTI ›':'TOLIAU ›';
  nextBtn.className=i===total-1?'btn-next last':'btn-next';

  const area=document.getElementById('step-area');
  area.innerHTML='';

  if(i>0){
    const sumDiv=document.createElement('div');
    sumDiv.className='summary-list';
    for(let j=0;j<i;j++){
      const pf=fields[j], val=formData[pf.key];
      const row=document.createElement('div');
      row.className='sum-row';
      row.innerHTML='<div class="sum-ltr" style="color:'+accentColor+'">'+pf.letter+'</div><div style="flex:1;min-width:0"><div class="sum-lbl">'+pf.label+'</div><div class="sum-val'+(val?'':' empty')+'">'+(val||'—')+'</div></div><div class="sum-edit">✎</div>';
      row.onclick=()=>{currentStep=j;renderStep();};
      sumDiv.appendChild(row);
    }
    area.appendChild(sumDiv);
  }

  const card=document.createElement('div');
  card.className='step-card';
  card.style.setProperty('--accent',accentColor);

  const curVal=formData[f.key]||'';
  const head=document.createElement('div');
  head.className='step-card-head';
  head.innerHTML='<div class="step-letter" style="color:'+accentColor+'">'+f.letter+'</div><div style="flex:1"><div class="step-label">'+f.label+'</div><div class="step-value'+(curVal?'':' empty')+'">'+(curVal||(f.hint||'Pasirink arba įvesk'))+'</div></div>';
  card.appendChild(head);
  const valDisplay=head.querySelector('.step-value');

  function updateVal(v){
    formData[f.key]=v;
    valDisplay.textContent=v||(f.hint||'Pasirink arba įvesk');
    valDisplay.classList.toggle('empty',!v);
  }

  // GPS
  if(f.gps){
    const gpsbtn=document.createElement('button');
    gpsbtn.className='gps-btn';
    gpsbtn.innerHTML='📍 GAUTI GPS KOORDINATES';
    gpsbtn.onclick=()=>{
      gpsbtn.innerHTML='⏳ NUSTATOMA...';
      gpsbtn.classList.add('loading');
      if(!navigator.geolocation){
        gpsShowManual(gpsbtn,card,updateVal); return;
      }
      navigator.geolocation.getCurrentPosition(
        pos=>{
          const lat=pos.coords.latitude;
          const lng=pos.coords.longitude;
          const acc=Math.round(pos.coords.accuracy);
          const mgrs=latLonToMGRS(lat,lng,5);
          const val=mgrs+' (±'+acc+'m)';
          updateVal(val);
          const fi=card.querySelector('.free-input');
          if(fi) fi.value=val;
          gpsbtn.className='gps-btn success';
          gpsbtn.innerHTML='✓ '+mgrs;
        },
        ()=>{ gpsShowManual(gpsbtn,card,updateVal); },
        {enableHighAccuracy:true,timeout:8000}
      );
    };
    card.appendChild(gpsbtn);
  }

  // Options
  if(f.opts&&f.opts.length){
    const grid=document.createElement('div');
    grid.className='opts-grid'+(f.cols===3?' cols3':f.cols===1?' cols1':'');
    f.opts.forEach(opt=>{
      const val=typeof opt==='object'?opt.value:opt;
      const lbl=typeof opt==='object'?opt.label:opt;
      const btn=document.createElement('button');
      btn.className='opt-btn'+(formData[f.key]===val?' selected':'');
      btn.style.color=accentColor;
      btn.textContent=lbl;
      btn.onclick=()=>{
        let v=val;
        if(f.key==='time'&&val==='DABAR') v=new Date().toTimeString().slice(0,5);
        updateVal(v);
        grid.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        const fi=card.querySelector('.free-input');
        if(fi) fi.value=v;
        if(!f.free) setTimeout(()=>nextStep(),200);
      };
      grid.appendChild(btn);
    });
    card.appendChild(grid);
  }

  // Free input
  if(f.free){
    const wrap=document.createElement('div');
    wrap.className='free-input-wrap';
    const isArea=(f.key==='desc'||f.key==='done'||f.key==='injury');
    const inp=isArea?document.createElement('textarea'):document.createElement('input');
    inp.className='free-input';
    if(isArea){inp.rows=2;inp.style.resize='none';}else inp.type='text';
    inp.placeholder=f.hint||'Laisvas tekstas...';
    inp.value=formData[f.key]||'';
    inp.oninput=()=>{
      updateVal(inp.value);
      card.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
    };
    wrap.appendChild(inp);
    card.appendChild(wrap);
  }

  area.appendChild(card);
  setTimeout(()=>{ area.scrollTop=area.scrollHeight; },50);
}

function gpsShowManual(btn,card,updateVal){
  btn.className='gps-btn';
  btn.style.background='rgba(255,171,0,0.15)';
  btn.style.borderColor='var(--amber)';
  btn.style.color='var(--amber)';
  btn.innerHTML='📋 ĮKLIJUOK KOORDINATES ŽEMIAU';
  if(!card.querySelector('.gps-helper')){
    const h=document.createElement('div');
    h.className='gps-helper';
    h.style.cssText='padding:0 14px 10px;display:flex;flex-direction:column;gap:6px;';
    h.innerHTML='<a href="https://maps.google.com" target="_blank" style="display:block;background:#1a2a3a;border:1px solid var(--blue);border-radius:10px;padding:12px;text-align:center;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:2px;color:var(--blue);text-decoration:none;">🗺 ATIDARYTI GOOGLE MAPS</a><div style="font-size:10px;color:var(--muted);text-align:center;line-height:1.7;">Maps → laikyk nuspaudęs bet kurį tašką<br>→ nukopijuok koordinates viršuje → įklijuok žemiau</div>';
    const fw=card.querySelector('.free-input-wrap');
    if(fw) card.insertBefore(h,fw); else card.appendChild(h);
  }
}

function nextStep(){
  const r=REPORTS[currentId];
  if(currentStep<r.fields.length-1){currentStep++;renderStep();}
  else generate();
}
function prevStep(){ if(currentStep>0){currentStep--;renderStep();} }

function generate(){
  const r=REPORTS[currentId], text=r.build(formData);
  document.getElementById('preview-box').textContent=text;
  const chars=text.length, parts=Math.ceil(chars/160);
  document.getElementById('preview-meta').textContent=chars+' simbolių · '+parts+' SMS'+(parts>1?' dalys':'');
  goTo('preview');
}

function sendSms(){ window.location.href='sms:?body='+encodeURIComponent(document.getElementById('preview-box').textContent); }
function copyMsg(){
  navigator.clipboard.writeText(document.getElementById('preview-box').textContent).then(()=>{
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),1800);
  });
}

function tick(){
  const t=new Date().toTimeString().slice(0,5);
  ['clock','clock2'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=t;});
}
tick(); setInterval(tick,10000);
</script>

<div id="install-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;border-top:1px solid #2c2c2e;padding:12px 16px;z-index:1000;display:flex;align-items:center;gap:12px;">
  <div style="flex:1">

</div>

<div id="ios-hint" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;border-top:2px solid #00e676;padding:16px;z-index:1000;">
  <div style="font-family:Oswald,sans-serif;font-size:13px;letter-spacing:2px;color:#00e676;margin-bottom:8px;">📲 ĮDIEGTI Į iPhone</div>
  <div style="font-size:12px;color:#ccc;line-height:1.8;">
    1. Spausk <strong style="color:#fff;">⬆ Dalintis</strong> (Share) apačioje<br>
    2. Pasirink <strong style="color:#fff;">"Add to Home Screen"</strong><br>
    3. Spausk <strong style="color:#fff;">Add</strong> – app atsiras ekrane!
  </div>
  <button onclick="document.getElementById('ios-hint').style.display='none'" style="margin-top:12px;width:100%;background:#2c2c2e;border:none;border-radius:8px;padding:10px;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:2px;color:#fff;cursor:pointer;">SUPRATAU</button>
</div>

<script>
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-bar').style.display = 'flex';
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('install-bar').style.display = 'none';
    });
  }
}

// iOS detection - show manual instructions
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
if (isIOS && !isStandalone) {
  setTimeout(() => {
    document.getElementById('ios-hint').style.display = 'block';
  }, 1500);
}

// Service Worker for offline use
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE = 'kr-v1';
    const ASSETS = [location.href];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([sw], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob), {scope: './'}).catch(()=>{});
}
</script>
