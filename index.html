<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kernius Rodžer">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.webmanifest">

<title>Kernius Rodžer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap');
:root{--bg:#0e0e0e;--card:#1c1c1e;--border:#2c2c2e;--green:#00e676;--red:#ff453a;--amber:#ffd60a;--blue:#0a84ff;--pink:#ff375f;--orange:#ff9f0a;--text:#fff;--muted:#8e8e93;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overscroll-behavior:none}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.back-btn{width:42px;height:42px;border-radius:50%;background:var(--card);border:none;color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn:active{background:#333}
.topbar-title{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:3px}
.topbar-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.clock{font-size:14px;color:var(--amber);font-family:'Oswald',sans-serif}
.night-btn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer}
.night-btn:active{background:#333}

.report-list{flex:1;overflow-y:auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px;min-height:0}
.rep-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;width:100%;color:var(--text);font-family:inherit}
.rep-btn:active{opacity:.7}
.rep-icon{width:50px;height:50px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:22px;font-weight:700}
.rep-text{flex:1}
.rep-code{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;margin-bottom:3px}
.rep-desc{font-size:11px;color:var(--muted);line-height:1.6}
.rep-arrow{color:var(--muted);font-size:20px}
.ic-red{background:rgba(255,69,58,.18);color:var(--red)}.ic-amber{background:rgba(255,214,10,.15);color:var(--amber)}.ic-green{background:rgba(0,230,118,.15);color:var(--green)}.ic-pink{background:rgba(255,55,95,.18);color:var(--pink)}.ic-blue{background:rgba(10,132,255,.18);color:var(--blue)}.ic-orange{background:rgba(255,159,10,.18);color:var(--orange)}
.bl-red{border-left:3px solid var(--red)}.bl-amber{border-left:3px solid var(--amber)}.bl-green{border-left:3px solid var(--green)}.bl-pink{border-left:3px solid var(--pink)}.bl-blue{border-left:3px solid var(--blue)}.bl-orange{border-left:3px solid var(--orange)}

.progress-wrap{padding:10px 16px 0;flex-shrink:0}
.progress-track{height:3px;background:var(--border);border-radius:2px}
.progress-fill{height:3px;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:5px;text-align:right}

.step-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative}
.step-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);flex-shrink:0}
.step-card-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.step-letter{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;width:36px;text-align:center;flex-shrink:0;line-height:1;margin-top:2px}
.step-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.step-value{font-size:15px;color:var(--text);word-break:break-word}
.step-value.empty{color:var(--muted);font-size:13px}
.step-legend{font-size:11px;color:var(--muted);padding:10px 16px 0;line-height:1.6}

.opts-grid{display:grid;gap:8px;padding:12px 14px 14px;grid-template-columns:1fr 1fr}
.opts-grid.cols3{grid-template-columns:1fr 1fr 1fr}.opts-grid.cols1{grid-template-columns:1fr}
.opt-btn{background:#252525;border:1.5px solid var(--border);border-radius:10px;padding:14px 8px;font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--text);cursor:pointer;text-align:center;line-height:1.3;min-height:60px;display:flex;align-items:center;justify-content:center}
.opt-btn:active{background:#333}
.opt-btn.selected{border-color:var(--accent,#fff);background:rgba(255,255,255,.09)}

.gps-btn{margin:12px 14px 4px;width:calc(100% - 28px);background:rgba(10,132,255,.15);border:1.5px solid var(--blue);border-radius:10px;padding:16px;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.gps-btn:active{background:rgba(10,132,255,.3)}
.gps-btn.loading{opacity:.6}
.gps-btn.success{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green);font-size:12px}
.gps-msg{margin:0 14px 8px;font-size:11px;color:var(--amber);line-height:1.6}

.free-input-wrap{padding:0 14px 14px}
.free-input{width:100%;background:#252525;border:1.5px solid var(--border);border-radius:10px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:16px;padding:14px;outline:none;resize:none;min-height:54px}
.free-input:focus{border-color:#666}
.free-input::placeholder{color:#666;font-size:13px}

.el-box{padding:0 14px 4px}
.el-sec{padding:10px 0;border-bottom:1px solid var(--border)}
.el-sec:last-child{border-bottom:none}
.el-title{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
.el-row{display:flex;align-items:center;gap:8px}
.el-status{flex:1;font-size:13px;word-break:break-all;min-width:0}
.el-mini{width:48px;height:48px;border-radius:10px;background:#252525;border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0}
.el-heading{font-family:'Oswald',sans-serif;font-size:52px;font-weight:700;text-align:center;line-height:1.1;color:var(--accent,#fff)}
.el-acc{text-align:center;font-size:11px;color:var(--muted);min-height:16px}
.el-big{width:100%;margin:8px 0 0;background:rgba(10,132,255,.15);border:1.5px solid var(--blue);border-radius:10px;padding:16px;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--blue);cursor:pointer}
.el-big.lock{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green)}
.el-big:active{opacity:.7}
.el-hint{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0}
.el-warn{font-size:11px;color:var(--amber);line-height:1.6;min-height:14px}
.el-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.el-lbl{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
.el-in{width:100%;background:#252525;border:1.5px solid var(--border);border-radius:10px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:16px;padding:12px;outline:none;min-height:50px}
.el-in:focus{border-color:#666}

.opts-grid.cols4{grid-template-columns:repeat(4,1fr)}
.el-chips{padding:10px 0 0 !important;gap:6px !important}
.el-chips .opt-btn{min-height:48px;font-size:13px;padding:6px 2px}
.el-headwrap{flex:0 0 40%}
.el-row .el-big{margin:0;flex:1;padding:14px 6px;font-size:14px}
.el-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.el-grid3 .el-in{padding:12px 8px}
.el-link{background:none;border:none;color:var(--blue);font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0}
.el-result{margin-top:4px;padding:12px;border-radius:10px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.3);color:var(--green);font-size:14px;line-height:1.6;word-break:break-word}

.nav-bar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-shrink:0;background:var(--bg);border-top:1px solid var(--border)}
.btn-prev{width:58px;height:58px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-prev:active{background:#333}.btn-prev:disabled{opacity:.25}
.btn-next{flex:1;height:58px;border-radius:12px;background:var(--green);border:none;font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;color:#000;cursor:pointer}
.btn-next:active{opacity:.85}.btn-next.last{background:var(--amber)}

.summary-list{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.sum-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);cursor:pointer}
.sum-row:active{background:#252525}
.sum-ltr{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;width:22px;flex-shrink:0;text-align:center}
.sum-lbl{font-size:10px;color:var(--muted);letter-spacing:1px}
.sum-val{font-size:12px;color:var(--text);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-val.empty{color:var(--muted);font-style:italic}
.sum-edit{margin-left:auto;font-size:12px;color:var(--muted);flex-shrink:0}

.preview-body{flex:1;overflow-y:auto;padding:16px;min-height:0}
.preview-box{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;font-size:15px;line-height:2;color:var(--green);white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.preview-meta{font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center;margin-bottom:16px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-btn{border-radius:12px;padding:22px 10px;border:none;cursor:pointer;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;display:flex;flex-direction:column;align-items:center;gap:6px}
.action-btn:active{opacity:.8}.action-btn .icon{font-size:26px}
.action-btn.sms{background:var(--amber);color:#000}
.action-btn.copy{background:#1e2e24;color:var(--green);border:1px solid var(--green)}
.action-btn.edit,.action-btn.new{background:var(--card);color:var(--muted);border:1px solid var(--border);font-size:12px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 28px;border-radius:30px;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

/* ───── misija ───── */
.mcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;flex-shrink:0}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.m-title{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:2px;word-break:break-word}
.m-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.m-elapsed{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;color:var(--green);margin-top:8px;letter-spacing:2px}
.chip-status{display:inline-block;font-size:10px;letter-spacing:2px;padding:4px 10px;border-radius:20px;border:1px solid currentColor;flex-shrink:0}
.m-big{width:100%;min-height:62px;border-radius:12px;border:none;font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;cursor:pointer;margin-bottom:10px;flex-shrink:0}
.m-big:active{opacity:.85}
.m-big.go{background:var(--green);color:#000}
.m-big.stop{background:#2a1a1a;color:var(--red);border:1px solid var(--red)}
.m-row{display:flex;gap:8px;margin-bottom:10px;flex-shrink:0}
.m-btn{flex:1;min-height:52px;border-radius:10px;background:#252525;border:1.5px solid var(--border);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:12px;cursor:pointer;padding:6px}
.m-btn:active{background:#333}
.m-btn.on{border-color:var(--green);color:var(--green)}
.m-btn.sm{flex:0 0 auto;min-height:40px;padding:6px 12px;font-size:11px}
.m-btn.danger{color:var(--red);border-color:var(--red)}
.opt-btn.sm{min-height:44px;font-size:12px;padding:6px 4px}
.nx-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;flex-shrink:0}
.nx-card.overdue{border-color:var(--red);background:#2a1414}
.nx-top{display:flex;justify-content:space-between;font-family:'Oswald',sans-serif;letter-spacing:2px;font-size:14px}
.nx-count{font-family:'Oswald',sans-serif;font-size:46px;font-weight:700;text-align:center;line-height:1.15;margin:4px 0}
.nx-card.overdue .nx-count{color:var(--red)}
.nx-sub{text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px}
.nx-go{width:100%;margin-top:10px;min-height:52px;border-radius:10px;border:1.5px solid var(--green);background:rgba(0,230,118,.12);color:var(--green);font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer}
.nx-card.overdue .nx-go{border-color:var(--red);background:rgba(255,69,58,.15);color:var(--red)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{min-height:56px;border-radius:10px;background:#252525;border:1.5px solid var(--border);font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer}
.qbtn:active{background:#333}
.sec-title{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;color:var(--muted);margin:6px 2px 8px}
.tl-row{display:flex;gap:8px;cursor:pointer}
.tl-time{width:46px;font-size:12px;color:var(--muted);padding-top:3px;flex-shrink:0}
.tl-rail{width:16px;position:relative;flex-shrink:0}
.tl-rail:before{content:'';position:absolute;left:7px;top:0;bottom:-2px;width:2px;background:var(--border)}
.tl-dot{position:absolute;left:3px;top:6px;width:10px;height:10px;border-radius:50%}
.tl-main{flex:1;padding-bottom:14px;min-width:0}
.tl-title{font-size:13px;word-break:break-word}
.tl-sub{font-size:11px;color:var(--muted);margin-top:2px}
.tl-row.missed .tl-title{color:var(--red)}
.tl-text{display:none;white-space:pre-wrap;word-break:break-word;background:#141414;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:6px;font-size:12px;color:var(--green);line-height:1.7}
.tl-text.open{display:block}
.tl-act{display:none;gap:8px;margin-top:6px}
.tl-act.open{display:flex}
.u-row{border-top:1px solid var(--border);padding:10px 0}
.u-name{flex:1;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:2px}
.m-note{font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.7}
.setup-bar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-shrink:0;background:var(--bg);border-top:1px solid var(--border)}
.setup-msg{font-size:12px;color:var(--amber);padding:0 16px 6px;min-height:16px}
.tl-row.live .tl-dot{background:var(--bg);border:2px solid var(--muted)}
.tl-row.live .tl-title{color:var(--text)}
.tl-row.live.overdue .tl-title,.tl-row.live.overdue .tl-sub{color:var(--red)}
.tl-row.live.overdue .tl-dot{border-color:var(--red)}
.tl-now{display:flex;align-items:center;gap:8px;margin:2px 0 10px 54px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3px;color:var(--green)}
.tl-now:before,.tl-now:after{content:'';flex:1;height:1px;background:var(--green);opacity:.5}
a.m-btn,a.action-btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.action-btn.signal{background:#3a76f0;color:#fff;grid-column:1/-1;flex-direction:row;gap:10px;padding:20px 10px}
.sig-hint{grid-column:1/-1;margin:-2px 0 6px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
.sig-hint a{color:var(--blue);text-decoration:underline}

/* naktinis režimas: raudonas daugybos sluoksnis. Jis NE fixed ir be background-color, kad iOS
   negalėtų paimti jo spalvos viršutinei būsenos juostai; veikia ir slenkamiems sąrašams. */
html.night,html.night body{background:#000;color-scheme:dark}
body{position:relative}
#night-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(#cc0000,#cc0000);mix-blend-mode:multiply;pointer-events:none;z-index:99999}
body.night #night-overlay{display:block}
body.night{--green:#ff3b30;--blue:#ff7a6b;--muted:#c06a60}

<script>
// Lightweight WGS84 -> MGRS conversion
(function(global){
  var NUM_100K_SETS=6, SET_ORIGIN_COLUMN_LETTERS='AJSAJS', SET_ORIGIN_ROW_LETTERS='AFAFAF';
  var A=65,I=73,O=79,V=86,Z=90;
  function get100kSetForZone(i){var s=i%NUM_100K_SETS;return s===0?NUM_100K_SETS:s;}
  function getLetter100kID(column,row,parm){
    var index=parm-1,colOrigin=SET_ORIGIN_COLUMN_LETTERS.charCodeAt(index),rowOrigin=SET_ORIGIN_ROW_LETTERS.charCodeAt(index);
    var colInt=colOrigin+column-1,rowInt=rowOrigin+row,rollover=false;
    if(colInt>Z){colInt=colInt-Z+A-1;rollover=true;}
    if(colInt===I||(colOrigin<I&&colInt>I)||((colInt>I||colOrigin<I)&&rollover)){colInt++;}
    if(colInt===O||(colOrigin<O&&colInt>O)||((colInt>O||colOrigin<O)&&rollover)){colInt++;if(colInt===I)colInt++;}
    if(colInt>Z){colInt=colInt-Z+A-1;}
    if(rowInt>V){rowInt=rowInt-V+A-1;rollover=true;}else{rollover=false;}
    if((rowInt===I)||((rowOrigin<I)&&(rowInt>I))||(((rowInt>I)||(rowOrigin<I))&&rollover)){rowInt++;}
    if((rowInt===O)||((rowOrigin<O)&&(rowInt>O))||(((rowInt>O)||(rowOrigin<O))&&rollover)){rowInt++;if(rowInt===I)rowInt++;}
    if(rowInt>V){rowInt=rowInt-V+A-1;}
    return String.fromCharCode(colInt)+String.fromCharCode(rowInt);
  }
  function encode(utm,accuracy){
    var seasting='00000'+utm.easting,snorthing='00000'+utm.northing;
    return utm.zoneNumber+utm.zoneLetter+getLetter100kID(
      Math.floor(utm.easting/100000),Math.floor(utm.northing/100000)%20,
      get100kSetForZone(utm.zoneNumber)
    )+(seasting.substr(seasting.length-5)).substr(0,accuracy)+(snorthing.substr(snorthing.length-5)).substr(0,accuracy);
  }
  function latLonToUtm(lat,lon){
    var Lat=lat,Long=lon,a=6378137.0,eccSquared=0.00669438,k0=0.9996;
    var LongOrigin,eccPrimeSquared,N,T,C,A2,M;
    var LatRad=Lat*Math.PI/180,LongRad=Long*Math.PI/180;
    var ZoneNumber=Math.floor((Long+180)/6)+1;
    if(Lat>=56.0&&Lat<64.0&&Long>=3.0&&Long<12.0)ZoneNumber=32;
    if(Lat>=72.0&&Lat<84.0){if(Long>=0.0&&Long<9.0)ZoneNumber=31;else if(Long>=9.0&&Long<21.0)ZoneNumber=33;else if(Long>=21.0&&Long<33.0)ZoneNumber=35;else if(Long>=33.0&&Long<42.0)ZoneNumber=37;}
    LongOrigin=(ZoneNumber-1)*6-180+3;
    var LongOriginRad=LongOrigin*Math.PI/180;
    eccPrimeSquared=eccSquared/(1-eccSquared);
    N=a/Math.sqrt(1-eccSquared*Math.sin(LatRad)*Math.sin(LatRad));
    T=Math.tan(LatRad)*Math.tan(LatRad);C=eccPrimeSquared*Math.cos(LatRad)*Math.cos(LatRad);
    A2=Math.cos(LatRad)*(LongRad-LongOriginRad);

function pad(n){return (n<10?'0':'')+n;}

/* DTG pagal NATO: DDHHMM + laiko juostos raidė + MMM YY (pvz. 181315C OCT 26) */
function dtgNow(){return dtgOf(new Date(nowMs()));}
function dtgOf(d){
  const offMin=-d.getTimezoneOffset();
  let L,Y,Mo,D,h,mi;
  if(offMin%60===0&&offMin>=-720&&offMin<=720){
    const off=offMin/60;
    L=off>=0?'ZABCDEFGHIKLM'.charAt(off):'NOPQRSTUVWXY'.charAt(-off-1);
    Y=d.getFullYear();Mo=d.getMonth();D=d.getDate();h=d.getHours();mi=d.getMinutes();
  }else{
    L='Z';Y=d.getUTCFullYear();Mo=d.getUTCMonth();D=d.getUTCDate();h=d.getUTCHours();mi=d.getUTCMinutes();
  }
  return pad(D)+pad(h)+pad(mi)+L+' '+MON[Mo]+' '+pad(Y%100);
}

/* magnetinė deklinacija Lietuvai (WMM2025, epocha 2026.8), bilinijinė interpoliacija */
const DECL={lat0:53.8,dlat:0.7,lon0:20.8,dlon:1.5,v:[[7.33, 7.72, 8.09, 8.47, 8.83], [7.49, 7.89, 8.29, 8.67, 9.05], [7.66, 8.07, 8.49, 8.89, 9.29], [7.83, 8.26, 8.69, 9.11, 9.52], [8.0, 8.45, 8.9, 9.34, 9.77]]};
function declAt(lat,lon){
  const V=DECL.v,ny=V.length,nx=V[0].length;
  const fy=Math.min(Math.max((lat-DECL.lat0)/DECL.dlat,0),ny-1),fx=Math.min(Math.max((lon-DECL.lon0)/DECL.dlon,0),nx-1);
  const y0=Math.floor(fy),x0=Math.floor(fx),y1=Math.min(y0+1,ny-1),x1=Math.min(x0+1,nx-1),ty=fy-y0,tx=fx-x0;
  const a=V[y0][x0]*(1-tx)+V[y0][x1]*tx,b=V[y1][x0]*(1-tx)+V[y1][x1]*tx;
  return Math.round((a*(1-ty)+b*ty)*10)/10;
}
function inLT(lat,lon){return lat>=53.3&&lat<=57.1&&lon>=20.3&&lon<=27.5;}

/* taško paieška pagal tikrąjį azimutą ir atstumą (metrais) */
function destPoint(lat,lon,brg,dist){
  /* WGS84 elipsoidas, vidurinės platumos kreivumo spinduliai (paklaida <0,1 m iki kelių km) */
  const a=6378137.0,e2=0.00669437999014,b=brg*Math.PI/180,p1=lat*Math.PI/180;
  let pm=p1,dlat=0,dlon=0;
  for(let k=0;k<3;k++){
    const s=Math.sin(pm),w=1-e2*s*s,M=a*(1-e2)/Math.pow(w,1.5),Nn=a/Math.sqrt(w);
    dlat=dist*Math.cos(b)/M;dlon=dist*Math.sin(b)/(Nn*Math.cos(pm));pm=p1+dlat/2;
  }
  return [(p1+dlat)*180/Math.PI,((lon+dlon*180/Math.PI+540)%360)-180];
}

function smsInfo(t){

let geo={lat:null,lon:null},enemy={az:null,dist:null,decl:null};

let returnScreen='select',routineKeyCtx=null,forceUnitEdit=false;

  stopCompass();

  document.getElementById('screen-'+s).classList.add('active');
  curScreen=s;
  if(s==='select')renderHomeMission();
  if(s==='mission')renderMission();
}
function isSkip(i){const f=REPORTS[currentId].fields[i];return missionUsable()&&f&&f.key==='unit'&&!!formData.unit&&!forceUnitEdit;}
function startReport(id,opts){
  opts=opts||{};
  returnScreen=opts.from||'select';routineKeyCtx=opts.routineKey||null;
  currentId=id;currentStep=0;formData={};geo={lat:null,lon:null};enemy={az:null,dist:null,decl:null};forceUnitEdit=false;lastLogged=null;

    while(currentStep<r.fields.length-1&&isSkip(currentStep))currentStep++;
  }

/* ───────── kompasas ───────── */
let compassOff=null,compassTimer=null,compassGranted=false;
function stopCompass(){
  if(compassOff){compassOff();compassOff=null;}
  if(compassTimer){clearTimeout(compassTimer);compassTimer=null;}
}
function compassStart(onHeading,onNeedPermission){
  stopCompass();
  const handler=function(e){
    let h=null,acc=null;
    if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)){
      h=e.webkitCompassHeading;
      if(typeof e.webkitCompassAccuracy==='number'&&e.webkitCompassAccuracy>=0)acc=e.webkitCompassAccuracy;
    }else if(e.alpha!=null&&(e.absolute===true||e.type==='deviceorientationabsolute')){
      h=(360-e.alpha)%360;
    }
    if(h!=null)onHeading(h,acc);
  };
  const attach=function(){
    window.addEventListener('deviceorientationabsolute',handler,true);
    window.addEventListener('deviceorientation',handler,true);
    compassOff=function(){
      window.removeEventListener('deviceorientationabsolute',handler,true);
      window.removeEventListener('deviceorientation',handler,true);
    };
  };
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'&&!compassGranted){
    try{
      DeviceOrientationEvent.requestPermission().then(function(s){
        if(s==='granted'){compassGranted=true;attach();}else onNeedPermission('denied');
      }).catch(function(){onNeedPermission('gesture');});
    }catch(e){onNeedPermission('gesture');}
  }else attach();
}

/* ───────── priešo vieta: kompasas + atstumas ───────── */
function buildEnemyLoc(card,updateVal){
  if(enemy.decl==null)enemy.decl=declAt(55.2,23.9);
  const box=document.createElement('div');box.className='el-box';
  box.innerHTML=
   '<div class="el-sec"><div class="el-row"><div class="el-title" style="margin:0">MANO VIETA</div><div class="el-status" id="el-gps">⏳ GPS…</div><button class="el-mini" id="el-gps-btn">↻</button></div></div>'+
   '<div class="el-sec"><div class="el-title">AZIMUTAS Į PRIEŠĄ</div>'+
     '<div class="el-row"><div class="el-headwrap"><div class="el-heading" id="el-head">---°</div><div class="el-acc" id="el-acc"></div></div>'+
     '<button class="el-big lock" id="el-lock">🎯 FIKSUOTI</button></div>'+
     '<button class="el-big" id="el-perm" style="display:none;margin-top:8px;width:100%">🧭 ĮJUNGTI KOMPASĄ</button>'+
     '<div class="el-hint" style="margin:6px 0 0">Telefonas horizontaliai, viršutinis kraštas į priešą · kompasas ±5–10° <button class="el-link" id="el-manual">✎ MGRS ranka</button></div>'+
     '<div class="el-warn" id="el-warn"></div></div>'+
   '<div class="el-sec"><div class="el-grid3">'+
     '<div><div class="el-lbl">AZIMUTAS °</div><input class="el-in" id="el-az" type="number" inputmode="numeric" min="0" max="359" placeholder="0–359"></div>'+
     '<div><div class="el-lbl">DEKL. °E</div><input class="el-in" id="el-decl" type="number" inputmode="decimal" step="0.1"></div>'+
     '<div><div class="el-lbl">ATSTUMAS m</div><input class="el-in" id="el-dist" type="number" inputmode="numeric" placeholder="300"></div></div>'+
     '<div class="opts-grid cols4 el-chips" id="el-chips"></div></div>';
  card.appendChild(box);
  const $=function(s){return box.querySelector(s);};
  const gpsSt=$('#el-gps'),gpsBtn=$('#el-gps-btn'),headEl=$('#el-head'),accEl=$('#el-acc'),permBtn=$('#el-perm'),lockBtn=$('#el-lock'),warnEl=$('#el-warn'),azIn=$('#el-az'),declIn=$('#el-decl'),distIn=$('#el-dist'),chipsEl=$('#el-chips'),manualBtn=$('#el-manual');
  azIn.value=enemy.az==null?'':enemy.az;declIn.value=enemy.decl;distIn.value=enemy.dist==null?'':enemy.dist;
  if(enemy.az!=null)lockBtn.textContent='✓ '+enemy.az+'° · IŠ NAUJO';
  let magH=null,sx=null,sy=null,seen=false,lastDraw=0;

  function manualWrap(){return card.querySelector('.free-input-wrap');}
  function showManual(on){const w=manualWrap();if(w)w.style.display=on?'block':'none';}
  function showTrue(){
    if(magH==null){headEl.textContent='---°';return;}
    headEl.textContent=Math.round((magH+enemy.decl+360)%360)%360+'°';
  }
  function refreshChips(){
    chipsEl.querySelectorAll('.opt-btn').forEach(function(b){b.classList.toggle('selected',enemy.dist===parseInt(b.dataset.v,10));});
  }
  function compute(){
    if(enemy.az==null||!(enemy.dist>0))return;
    let val;
    if(geo.lat!=null){
      const p=destPoint(geo.lat,geo.lon,enemy.az,enemy.dist);
      val=latLonToMGRS(p[0],p[1],4)+' (AZ '+enemy.az+'°, '+enemy.dist+'m)';
    }else val='AZ '+enemy.az+'°, '+enemy.dist+'m';
    updateVal(val);
    const fi=card.querySelector('.free-input');if(fi)fi.value=val;
  }
  function gpsGo(){
    gpsSt.textContent='⏳ GPS…';
    if(!navigator.geolocation){gpsSt.textContent='⚠ GPS nepasiekiamas';showManual(true);return;}
    navigator.geolocation.getCurrentPosition(function(p){
      geo.lat=p.coords.latitude;geo.lon=p.coords.longitude;
      gpsSt.textContent='✓ '+latLonToMGRS(geo.lat,geo.lon,5);
      if(inLT(geo.lat,geo.lon)){enemy.decl=declAt(geo.lat,geo.lon);warnEl.textContent='';}
      else warnEl.textContent='⚠ Už Lietuvos ribų – patikrink deklinaciją';
      declIn.value=enemy.decl;showTrue();compute();
    },function(){gpsSt.textContent='⚠ GPS nepavyko – leidimas? ↻';showManual(true);},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  }
  function onHeading(h,acc){
    seen=true;const r=h*Math.PI/180;
    if(sx==null){sx=Math.sin(r);sy=Math.cos(r);}else{sx=sx*0.85+Math.sin(r)*0.15;sy=sy*0.85+Math.cos(r)*0.15;}
    magH=(Math.atan2(sx,sy)*180/Math.PI+360)%360;
    const now=Date.now();
    if(now-lastDraw>100){lastDraw=now;showTrue();accEl.textContent=acc!=null?'±'+Math.round(acc)+'°':'';}
  }
  function startC(){
    permBtn.style.display='none';seen=false;sx=null;sy=null;
    compassStart(onHeading,function(kind){
      permBtn.style.display='block';
      permBtn.textContent=kind==='denied'?'🧭 KOMPASAS UŽDRAUSTAS · BANDYTI DAR KARTĄ':'🧭 ĮJUNGTI KOMPASĄ';
    });
    if(compassTimer)clearTimeout(compassTimer);
    compassTimer=setTimeout(function(){
      if(!seen&&permBtn.style.display==='none')warnEl.textContent='⚠ Kompasas nepasiekiamas – įvesk azimutą ranka';
    },3000);
  }

  [50,100,150,200,300,500,800,1000].forEach(function(m){
    const b=document.createElement('button');b.className='opt-btn';b.style.color=accentColor;b.dataset.v=m;b.textContent=m+' m';
    b.onclick=function(){enemy.dist=m;distIn.value=m;refreshChips();compute();};
    chipsEl.appendChild(b);
  });
  refreshChips();
  distIn.oninput=function(){const v=parseFloat(distIn.value);enemy.dist=v>0?Math.round(v):null;refreshChips();compute();};
  azIn.oninput=function(){const v=parseFloat(azIn.value);enemy.az=isNaN(v)?null:((Math.round(v)%360)+360)%360;compute();};
  declIn.oninput=function(){const v=parseFloat(declIn.value);enemy.decl=isNaN(v)?0:v;showTrue();};
  lockBtn.onclick=function(){
    if(magH==null){warnEl.textContent='⚠ Dar nėra kompaso rodmens – įvesk azimutą ranka';return;}
    enemy.az=Math.round((magH+enemy.decl+360)%360)%360;azIn.value=enemy.az;
    lockBtn.textContent='✓ '+enemy.az+'° · IŠ NAUJO';compute();
  };
  manualBtn.onclick=function(){const w=manualWrap();showManual(!w||w.style.display==='none');};
  permBtn.onclick=startC;
  gpsBtn.onclick=gpsGo;
  gpsGo();startC();
}

/* ───────── žingsnių piešimas ───────── */
function renderStep(){
  stopCompass();
  const r=REPORTS[currentId],fields=r.fields,total=fields.length,i=currentStep,f=fields[i];
  const pf=document.getElementById('prog-fill');
  const vis=fields.map(function(_,ix){return ix;}).filter(function(ix){return !isSkip(ix)||ix===i;});
  pf.style.width=((vis.indexOf(i)+1)/vis.length*100)+'%';pf.style.background=accentColor;
  document.getElementById('prog-label').textContent=(vis.indexOf(i)+1)+' / '+vis.length;
  document.getElementById('btn-prev').disabled=(i===0);
  const nb=document.getElementById('btn-next');
  nb.textContent=i===total-1?'GENERUOTI ›':'TOLIAU ›';
  nb.className=i===total-1?'btn-next last':'btn-next';

  const area=document.getElementById('step-area');area.innerHTML='';

  if(i>0){
    const sumDiv=document.createElement('div');sumDiv.className='summary-list';
    for(let j=0;j<i;j++){
      const pj=fields[j],val=formData[pj.key];
      const row=document.createElement('div');row.className='sum-row';
      const ltr=document.createElement('div');ltr.className='sum-ltr';ltr.style.color=accentColor;ltr.textContent=pj.letter;
      const mid=document.createElement('div');mid.style.cssText='flex:1;min-width:0';
      const lb=document.createElement('div');lb.className='sum-lbl';lb.textContent=pj.label;
      const vl=document.createElement('div');vl.className='sum-val'+(val?'':' empty');vl.textContent=val||'—';
      mid.appendChild(lb);mid.appendChild(vl);
      const ed=document.createElement('div');ed.className='sum-edit';ed.textContent='✎';
      row.appendChild(ltr);row.appendChild(mid);row.appendChild(ed);
      row.onclick=function(){currentStep=j;if(pj.key==='unit')forceUnitEdit=true;renderStep();};
      sumDiv.appendChild(row);
    }
    area.appendChild(sumDiv);
  }

  const card=document.createElement('div');card.className='step-card';card.style.setProperty('--accent',accentColor);
  const head=document.createElement('div');head.className='step-card-head';
  head.innerHTML='<div class="step-letter"></div><div style="flex:1;min-width:0"><div class="step-label"></div><div class="step-value"></div></div>';
  const letEl=head.querySelector('.step-letter');letEl.style.color=accentColor;letEl.textContent=f.letter;
  head.querySelector('.step-label').textContent=f.label;
  const valEl=head.querySelector('.step-value');
  const hintTxt=f.hint||'Pasirink arba įvesk';
  function paintVal(){const v=formData[f.key]||'';valEl.textContent=v||hintTxt;valEl.classList.toggle('empty',!v);}
  paintVal();card.appendChild(head);
  function updateVal(v){formData[f.key]=v;paintVal();}

  if(f.legend){const lg=document.createElement('div');lg.className='step-legend';lg.textContent=f.legend;card.appendChild(lg);}

  const fopts=fieldOpts(f);
  const chipBtns=[];
  function tokens(){return (formData[f.key]||'').split(', ').filter(Boolean);}
  function refreshSel(){
    const tk=tokens();
    chipBtns.forEach(function(c){c.btn.classList.toggle('selected',f.multi?tk.indexOf(c.val)>=0:formData[f.key]===c.val);});
  }

  if(f.type==='enemyloc'){
    buildEnemyLoc(card,updateVal);
  }else{
    if(f.gps){
      const gb=document.createElement('button');gb.className='gps-btn';gb.textContent='📍 GAUTI GPS KOORDINATES (MGRS)';
      const msg=document.createElement('div');msg.className='gps-msg';
      gb.onclick=function(){
        gb.textContent='⏳ NUSTATOMA…';gb.classList.add('loading');msg.textContent='';
        if(!navigator.geolocation){gb.classList.remove('loading');gb.textContent='📍 BANDYTI DAR KARTĄ';msg.textContent='⚠ GPS nepasiekiamas – įvesk MGRS ranka.';return;}
        navigator.geolocation.getCurrentPosition(function(p){
          const mg=latLonToMGRS(p.coords.latitude,p.coords.longitude,5);
          updateVal(mg);const fi=card.querySelector('.free-input');if(fi)fi.value=mg;
          gb.className='gps-btn success';gb.textContent='✓ '+mg;
        },function(){
          gb.classList.remove('loading');gb.textContent='📍 BANDYTI DAR KARTĄ';
          msg.textContent='⚠ GPS nepavyko. Patikrink leidimą (Nustatymai → Safari → Vieta) arba įvesk MGRS ranka.';
        },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
      };
      card.appendChild(gb);card.appendChild(msg);
    }
    if(fopts&&fopts.length){
      const grid=document.createElement('div');
      grid.className='opts-grid'+(f.cols===3?' cols3':f.cols===1?' cols1':'');
      fopts.forEach(function(opt){
        const val=typeof opt==='object'?opt.value:opt,lbl=typeof opt==='object'?opt.label:opt;
        const btn=document.createElement('button');btn.className='opt-btn';btn.style.color=accentColor;btn.textContent=lbl;
        btn.onclick=function(){
          const fi=card.querySelector('.free-input');
          if(f.multi){
            const arr=tokens(),ix=arr.indexOf(val);
            if(ix>=0)arr.splice(ix,1);else arr.push(val);
            const v=arr.join(', ');updateVal(v);if(fi)fi.value=v;refreshSel();return;
          }
          let v=val;if(f.key==='time'&&val==='DABAR')v=dtgNow();
          updateVal(v);if(fi)fi.value=v;refreshSel();
          if(!f.free)setTimeout(function(){nextStep();},200);
        };
        chipBtns.push({btn:btn,val:val});grid.appendChild(btn);
      });
      card.appendChild(grid);refreshSel();
    }
  }

  if(f.free){
    const wrap=document.createElement('div');wrap.className='free-input-wrap';
    const inp=f.area?document.createElement('textarea'):document.createElement('input');
    inp.className='free-input';if(f.area)inp.rows=2;else inp.type='text';
    inp.placeholder=f.hint||'Laisvas tekstas…';inp.value=formData[f.key]||'';
    inp.oninput=function(){updateVal(inp.value);refreshSel();};
    if(f.type==='enemyloc')wrap.style.display='none';
    wrap.appendChild(inp);card.appendChild(wrap);
  }

  area.appendChild(card);
  setTimeout(function(){
    if(card.offsetHeight>area.clientHeight*0.7)area.scrollTop=Math.max(card.offsetTop-10,0);
    else area.scrollTop=area.scrollHeight;
  },50);
}

function nextStep(){
  const last=REPORTS[currentId].fields.length-1;
  forceUnitEdit=false;
  if(currentStep>=last){generate();return;}
  currentStep++;
  while(currentStep<last&&isSkip(currentStep))currentStep++;
  renderStep();
}
function prevStep(){
  let s=currentStep-1;
  while(s>=0&&isSkip(s))s--;
  if(s>=0){currentStep=s;forceUnitEdit=false;renderStep();}
}

function generate(){
  const r=REPORTS[currentId],text=r.build(formData,dtgNow());
  document.getElementById('preview-box').textContent=text;
  const s=smsInfo(text);
  document.getElementById('preview-meta').textContent=s.n+' simbolių · '+s.parts+' SMS'+(s.gsm?'':' (Unicode)');
  const n=hqNums();
  document.getElementById('preview-to').textContent=n?('GAVĖJAI: '+n.replace(/,/g,', ')):'';
  const sig=signalLink(),sb=document.getElementById('btn-signal');
  sb.setAttribute('href',sig||'#');
  document.getElementById('signal-hint').innerHTML=sig?('Atsidarys kanalas · palaikyk žinutės lauke → <b style="color:var(--text)">Įklijuoti</b> → siųsti<br><a href="'+signalAlt(sig)+'" onclick="copyPreview()">neatsidaro? bandyti kitą nuorodą</a>'):'Kanalas nenustatytas · spausk ir pasirink Signal per „Dalintis“';
  lastLogged=null;
  goTo('preview');
}
function sendSms(){
  const text=document.getElementById('preview-box').textContent,n=hqNums();
  logMessage();
  openUrl('sms:'+n+(n?'?&body=':'?body=')+encodeURIComponent(text));
}
function openUrl(u){window.location.href=u;}
function copyMsg(){
  logMessage();
  navigator.clipboard.writeText(document.getElementById('preview-box').textContent).then(function(){
    const t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);
  });
}

/* ═════════ MISIJA ═════════ */
const MKEY='kr_mission_v1';
const PRESET_UNITS=['CHARLI 1','CHARLI 2','CHARLI 3','DELTA 1','DELTA 2','DELTA 3'];
const RTYPES={sitrep:{label:'SITREP',report:'sitrep'},lace:{label:'LACE',report:'lace'},check:{label:'RYŠIO PATIKRA',report:null},custom:{label:'KITA',report:null}};
let mission=null,draft=null,draftNew=true,curScreen='select',lastSig='',lastLogged=null;
const armed={};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function nowMs(){return Date.now();}
function hhmm(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtMS(ms){ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return h>0?h+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s);}
function fmtHMS(ms){ms=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(ms/3600))+':'+pad(Math.floor(ms%3600/60))+':'+pad(ms%60);}
function fmtCd(ms){return ms<0?'-'+fmtMS(-ms):fmtMS(ms);}


/* ───── Signal: kanalo nuoroda + kopijavimas ───── */
function signalLink(){
  const raw=String((missionUsable()&&mission.hq&&mission.hq.signal)||'').trim();
  if(!raw)return '';
  if(/^https:\/\/signal\.(group|me)\/#/i.test(raw))return raw;
  if(/^sgnl:\/\/signal\.(group|me)\/#/i.test(raw))return raw.replace(/^sgnl:\/\//i,'https://');
  const num=raw.replace(/[^0-9+]/g,'');
  if(/^\+\d{7,15}$/.test(num))return 'https://signal.me/#p/'+num;
  return '';
}
function signalAlt(l){return l.replace(/^https:\/\//,'sgnl://');}
function copySync(t){
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);document.execCommand('copy');ta.remove();}catch(e){}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(function(){});}catch(e){}
}
function shareOrCopy(t){
  if(navigator.share){navigator.share({text:t}).catch(function(){});}
  else{copySync(t);const el=document.getElementById('toast');el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);}
}
function copyPreview(){copySync(document.getElementById('preview-box').textContent);}
function onSignal(ev){
  const text=document.getElementById('preview-box').textContent,link=signalLink();
  logMessage();
  if(!link){ev.preventDefault();shareOrCopy(text);return false;}
  copySync(text);
  return true;
}

function loadMission(){
  try{const s=localStorage.getItem(MKEY);mission=s?JSON.parse(s):null;}catch(e){mission=null;}
}
function saveMission(){try{if(mission)localStorage.setItem(MKEY,JSON.stringify(mission));else localStorage.removeItem(MKEY);}catch(e){}}
function missionUsable(){return !!mission&&mission.status!=='ended';}
function mUnit(n){return mission?mission.units.find(function(u){return u.name===n;}):null;}
function unitText(n){const u=mUnit(n);return u&&u.callsign?u.callsign:n;}
function uT(n){return n?(missionUsable()?unitText(n):n):'?';}
function hqNums(){return missionUsable()&&mission.hq&&mission.hq.phones?String(mission.hq.phones).replace(/[^0-9+,;]/g,'').replace(/;/g,','):'';}
function rLabel(r){return r.type==='custom'?(r.label||'KITA'):RTYPES[r.type].label;}
function typeColor(t){return REPORTS[t]?REPORTS[t].color:(t==='check'?'var(--amber)':'var(--orange)');}
function fieldOpts(f){
  if(f.opts===UNITS&&missionUsable())return mission.units.map(function(u){return L(u.callsign?(u.callsign+' · '+u.name):u.name,u.name);});
  return f.opts;
}

/* ───── rutinos: kada ką siųsti ───── */
function routineItems(now){
  const m=mission;
  if(!m||!m.startedAt||m.status==='planned')return [];
  if(m.status==='ended'&&m.endedAt)now=Math.min(now,m.endedAt);
  const out=[];
  m.routines.forEach(function(r){
    if(!r.on)return;
    let ups=0;
    for(let k=0;k<2000;k++){
      const t=m.startedAt+(r.first+k*r.every)*60000;
      if(m.endedAt&&t>m.endedAt)break;
      const key=r.id+':'+k;
      const done=m.log.find(function(l){return l.routineKey===key;});
      let state;
      if(done)state='done';else if(now<t)state='upcoming';else if(now-t>=r.every*60000)state='missed';else state='overdue';
      if(state==='upcoming'){out.push({r:r,k:k,key:key,t:t,state:state});if(++ups>=3)break;continue;}
      out.push({r:r,k:k,key:key,t:t,state:state,entry:done});
    }
  });
  return out.sort(function(a,b){return a.t-b.t;});
}
function nextItem(now){
  const it=routineItems(now).filter(function(o){return o.state==='overdue'||o.state==='upcoming';});
  const od=it.filter(function(o){return o.state==='overdue';});
  return od.length?od[0]:(it[0]||null);
}
function matchRoutine(type,ts){
  const c=routineItems(ts).filter(function(o){return RTYPES[o.r.type].report===type&&(o.state==='overdue'||(o.state==='upcoming'&&o.t-ts<=10*60000));});
  return c.length?c[0].key:null;
}
function logMessage(){
  if(!mission||mission.status!=='active')return;
  const text=document.getElementById('preview-box').textContent;
  if(lastLogged===text)return;lastLogged=text;
  const ts=nowMs();
  mission.log.push({id:uid(),ts:ts,kind:'msg',type:currentId,unit:formData.unit||mission.me,text:text,routineKey:routineKeyCtx||matchRoutine(currentId,ts)||null});
  saveMission();lastSig='';
}
function goRoutine(key){
  const it=routineItems(nowMs()).find(function(o){return o.key===key;});
  if(!it)return;
  const rep=RTYPES[it.r.type].report;
  if(rep){startReport(rep,{from:'mission',routineKey:key});}
  else{mission.log.push({id:uid(),ts:nowMs(),kind:'check',type:it.r.type,label:rLabel(it.r),routineKey:key});saveMission();lastSig='';missionTick();}
}

function stateBadge(st){return st==='active'?['VYKSTA','var(--green)']:st==='ended'?['BAIGTA','var(--muted)']:['PARUOŠTA','var(--amber)'];}
function renderMission(){
  const root=document.getElementById('mission-body');if(!root)return;
  const sc=root.scrollTop;
  document.getElementById('mission-title').textContent=mission?(mission.name||'MISIJA'):'MISIJA';

  const now=nowMs(),st=mission.status,b=stateBadge(st);
  let h='<div class="mcard"><div class="row-between"><div class="m-title">'+esc(mission.name)+'</div><span class="chip-status" style="color:'+b[1]+'">'+b[0]+'</span></div>'+
    '<div class="m-sub">Mano skyrius: <b style="color:var(--text)">'+esc(unitText(mission.me))+'</b> · skyrių: '+mission.units.length+(mission.hq&&mission.hq.callsign?' · štabas: <b style="color:var(--text)">'+esc(mission.hq.callsign)+'</b>':'')+(mission.hq&&mission.hq.freq?' · '+esc(mission.hq.freq):'')+(signalLink()?' · Signal ✓':'')+'</div>';

  if(st==='ended'&&mission.endedAt)h+='<div class="m-sub">Trukmė: '+fmtHMS(mission.endedAt-mission.startedAt)+'</div>';

  if(st==='planned'){
    h+='<button class="m-big go" data-act="start">▶ PRADĖTI MISIJĄ</button>';
    h+='<div class="mcard"><div class="el-title">RUTINA</div>'+(mission.routines.length?mission.routines.map(function(r){return '<div class="m-sub" style="margin:2px 0">'+(r.on?'●':'○')+' '+esc(rLabel(r))+' – kas '+r.every+' min (pirma po '+r.first+')</div>';}).join(''):'<div class="m-sub">Rutinų nėra</div>')+'</div>';

  }
  if(st==='active'){
    const items=routineItems(now);
    const live=items.filter(function(o){return o.state==='overdue'||o.state==='upcoming';});
    const od=live.filter(function(o){return o.state==='overdue';}).sort(function(a,c){return a.t-c.t;});
    const up=live.filter(function(o){return o.state==='upcoming';}).sort(function(a,c){return a.t-c.t;});
    const nx=od.length?od[0]:(up[0]||null);
    if(nx){
      const rep=RTYPES[nx.r.type].report;
      h+='<div class="nx-card'+(nx.state==='overdue'?' overdue':'')+'"><div class="nx-top"><span>KITAS: '+esc(rLabel(nx.r))+'</span><span>'+hhmm(nx.t)+'</span></div>'+
        '<div class="nx-count" data-cd="'+nx.t+'">'+fmtCd(nx.t-now)+'</div><div class="nx-sub">'+(nx.state==='overdue'?'VĖLUOJA':'LIKO')+'</div>'+
        '<button class="nx-go" data-act="go" data-v="'+nx.key+'">'+(rep?'RENGTI '+esc(rLabel(nx.r))+' ›':'✓ PADARYTA')+'</button></div>';
    }else h+='<div class="mcard"><div class="m-sub">Rutinų nėra – pridėk per ⚙ REDAGUOTI.</div></div>';

    h+='<div class="mcard"><div class="el-title">GREITI PRANEŠIMAI</div><div class="qgrid">'+['contactrep','saluto','lace','medevac','mist','sitrep'].map(function(id){return '<button class="qbtn" style="color:'+REPORTS[id].color+'" data-act="q" data-v="'+id+'">'+REPORTS[id].title+'</button>';}).join('')+'</div></div>';

    /* laiko juosta: ateities rutinos, DABAR, praeitis (naujausia viršuje) */
    const rows=[];
    od.concat(up.slice(0,2)).forEach(function(o){rows.push({ts:o.t,live:o});});
    mission.log.forEach(function(e){rows.push({ts:e.ts,e:e});});
    items.filter(function(o){return o.state==='missed';}).forEach(function(o){rows.push({ts:o.t,missed:o});});
    rows.sort(function(a,c){return c.ts-a.ts;});

    const drawNow=function(){h+='<div class="tl-now"><span>DABAR</span></div>';nowDrawn=true;};
    rows.forEach(function(x){
      if(!nowDrawn&&x.ts<=now&&!(x.live&&x.live.state==='overdue'))drawNow();
      if(x.live){
        const o=x.live,od2=o.state==='overdue';
        h+='<div class="tl-row live'+(od2?' overdue':'')+'" data-act="go" data-v="'+o.key+'"><div class="tl-time">'+hhmm(o.t)+'</div><div class="tl-rail"><div class="tl-dot"></div></div><div class="tl-main"><div class="tl-title">'+esc(rLabel(o.r))+' · rutina</div><div class="tl-sub">'+(od2?'VĖLUOJA ':'po ')+'<span data-cd="'+o.t+'">'+fmtCd(o.t-now)+'</span></div></div></div>';

        h+='<div class="tl-row missed"><div class="tl-time">'+hhmm(x.ts)+'</div><div class="tl-rail"><div class="tl-dot" style="background:var(--red)"></div></div><div class="tl-main"><div class="tl-title">'+esc(rLabel(x.missed.r))+' – PRALEISTA</div><div class="tl-sub">rutina nebuvo atlikta</div></div></div>';

      }
    });

    h+='</div>';

    h+='<div class="m-row" style="margin-top:6px"><button class="m-btn" data-act="edit">⚙ REDAGUOTI</button><button class="m-btn danger" data-act="end">'+(armed.end?'SPAUSK DAR KARTĄ':'■ BAIGTI MISIJĄ')+'</button></div>';
  }

    h+='<div class="m-row"><button class="m-btn danger" data-act="newm">＋ NAUJA MISIJA</button></div>';
  }
  if(mission.notes)h+='<div class="mcard"><div class="el-title">PASTABOS</div><div class="m-note">'+esc(mission.notes)+'</div></div>';
  root.innerHTML=h;root.scrollTop=sc;
  root.querySelectorAll('[data-act]').forEach(function(el){el.onclick=function(ev){ev.stopPropagation();missionAct(el.dataset.act,el.dataset.v,ev);};});
}
function arm(k){armed[k]=true;renderMission();setTimeout(function(){armed[k]=false;if(curScreen==='mission')renderMission();},3000);}
function missionAct(a,v,ev){
  if(a==='start'){mission.status='active';mission.startedAt=nowMs();mission.endedAt=null;mission.log=[];saveMission();lastSig='';renderMission();}
  else if(a==='edit')openSetup(false);
  else if(a==='del'){if(!armed.del){arm('del');return;}armed.del=false;mission=null;saveMission();goTo('select');}
  else if(a==='end'){if(!armed.end){arm('end');return;}armed.end=false;mission.status='ended';mission.endedAt=nowMs();saveMission();lastSig='';renderMission();}
  else if(a==='newm')openSetup(true);
  else if(a==='tsig'){const e=mission.log.find(function(x){return x.id===v;});if(!e)return;if(!signalLink()){if(ev)ev.preventDefault();shareOrCopy(e.text);}else copySync(e.text);}
  else if(a==='q')startReport(v,{from:'mission'});
  else if(a==='go')goRoutine(v);
  else if(a==='tl'){const t=document.getElementById('tt-'+v),c=document.getElementById('ta-'+v);if(t){t.classList.toggle('open');c.classList.toggle('open');}}
  else if(a==='tcopy'||a==='tsms'){const e=mission.log.find(function(x){return x.id===v;});if(!e)return;if(a==='tcopy')copyText(e.text);else{const n=hqNums();openUrl('sms:'+n+(n?'?&body=':'?body=')+encodeURIComponent(e.text));}}
  else if(a==='copylog')copyText(logText());
}
function copyText(t){
  const done=function(){const el=document.getElementById('toast');el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(function(){});
}
function logText(){
  const m=mission;
  let out='MISIJA: '+m.name+'\nPRADŽIA: '+dtgOf(new Date(m.startedAt))+(m.endedAt?'\nPABAIGA: '+dtgOf(new Date(m.endedAt)):'')+'\nMANO SKYRIUS: '+unitText(m.me)+'\n';
  const rows=m.log.map(function(e){return {ts:e.ts,e:e};});
  routineItems(nowMs()).filter(function(o){return o.state==='missed';}).forEach(function(o){rows.push({ts:o.t,m:o});});
  rows.sort(function(a,b){return a.ts-b.ts;});
  rows.forEach(function(x){
    out+='\n['+dtgOf(new Date(x.ts))+'] ';
    if(x.m)out+=rLabel(x.m.r)+' – PRALEISTA\n';
    else if(x.e.kind==='msg')out+=REPORTS[x.e.type].title+' · '+unitText(x.e.unit)+(x.e.routineKey?' (rutina)':'')+'\n'+x.e.text+'\n';
    else out+=x.e.label+' – padaryta\n';
  });
  return out;
}

function checkSignalField(v){

}
function setupAct(a,v,rid){
  const d=draft,r=rid?d.routines.find(function(x){return x.id===rid;}):null;
  const fixMe=function(){if(!d.units.some(function(u){return u.name===d.me;}))d.me=d.units.length?d.units[0].name:'';};
  if(a==='utog'){const i=d.units.findIndex(function(u){return u.name===v;});if(i>=0)d.units.splice(i,1);else d.units.push({name:v,callsign:'',phone:''});fixMe();}
  else if(a==='uadd'){const inp=document.getElementById('sf-custom'),n=(inp.value||'').trim().toUpperCase();if(n&&!d.units.some(function(u){return u.name===n;}))d.units.push({name:n,callsign:'',phone:''});fixMe();}
  else if(a==='ume')d.me=v;
  else if(a==='udel'){d.units=d.units.filter(function(u){return u.name!==v;});fixMe();}
  else if(a==='rtype'&&r){r.type=v;if(v!=='custom')r.label='';}
  else if(a==='revery'&&r){const wasDefault=r.first===r.every;r.every=parseInt(v,10);if(wasDefault)r.first=r.every;}
  else if(a==='ron'&&r)r.on=!r.on;
  else if(a==='rdel'&&r)d.routines=d.routines.filter(function(x){return x.id!==rid;});
  else if(a==='radd')d.routines.push({id:uid(),type:'sitrep',label:'',every:60,first:60,on:true});
  else if(a==='cancel'){goTo(mission?'mission':'select');return;}
  renderSetup();
}
function saveSetup(){
  const d=draft,msg=document.getElementById('setup-msg');
  if(!d.units.length){msg.textContent='⚠ Pasirink bent vieną skyrių';return;}
  if(!d.units.some(function(u){return u.name===d.me;}))d.me=d.units[0].name;
  d.name=(d.name||'').trim()||('Misija '+dtgNow().slice(0,6));
  d.routines.forEach(function(r){r.every=Math.max(1,r.every|0);r.first=Math.max(0,r.first|0);});
  mission=d;saveMission();lastSig='';goTo('mission');
}

document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')missionTick();});
function missionTick(){
  const now=nowMs();
  document.querySelectorAll('[data-cd]').forEach(function(el){el.textContent=fmtCd(parseInt(el.dataset.cd,10)-now);});
  if(!mission||mission.status!=='active')return;
  const el=document.getElementById('mi-elapsed');
  if(el)el.textContent='T+'+fmtHMS(now-mission.startedAt);
  const items=routineItems(now);
  const sig=items.map(function(i){return i.key+i.state;}).join('|')+'#'+mission.log.length;
  if(sig!==lastSig){lastSig=sig;if(curScreen==='mission')renderMission();else if(curScreen==='select')renderHomeMission();}
}

/* ───────── naktinis režimas, laikrodis, offline ───────── */
function applyNight(on){
  document.body.classList.toggle('night',on);
  document.documentElement.classList.toggle('night',on);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',on?'#000000':'#0e0e0e');
}
function toggleNight(){
  const on=!document.body.classList.contains('night');
  applyNight(on);
  try{localStorage.setItem('kr_night',on?'1':'0');}catch(e){}
}
try{if(localStorage.getItem('kr_night')==='1')applyNight(true);}catch(e){}

function tick(){
  const t=new Date().toTimeString().slice(0,5);
  ['clock','clock2','clock3'].forEach(function(id){const el=document.getElementById(id);if(el)el.textContent=t;});
}
tick();setInterval(tick,10000);

/* ───── paleidimas ───── */
loadMission();
document.getElementById('setup-back').onclick=function(){setupAct('cancel');};
document.getElementById('setup-cancel').onclick=function(){setupAct('cancel');};
document.getElementById('setup-save').onclick=saveSetup;
renderHomeMission();
setInterval(missionTick,1000);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
