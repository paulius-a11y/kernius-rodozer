<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kernius Rodžer">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kernius Rodžer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&display=swap');
:root{--bg:#0e0e0e;--card:#1c1c1e;--border:#2c2c2e;--green:#00e676;--red:#ff453a;--amber:#ffd60a;--blue:#0a84ff;--pink:#ff375f;--orange:#ff9f0a;--text:#fff;--muted:#8e8e93;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overscroll-behavior:none}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.back-btn{width:42px;height:42px;border-radius:50%;background:var(--card);border:none;color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn:active{background:#333}
.topbar-title{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:3px}
.topbar-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.clock{font-size:14px;color:var(--amber);font-family:'Oswald',sans-serif}
.night-btn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer}
.night-btn:active{background:#333}

.report-list{flex:1;overflow-y:auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:10px;min-height:0}
.rep-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;width:100%;color:var(--text);font-family:inherit}
.rep-btn:active{opacity:.7}
.rep-icon{width:50px;height:50px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:22px;font-weight:700}
.rep-text{flex:1}
.rep-code{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;margin-bottom:3px}
.rep-desc{font-size:11px;color:var(--muted);line-height:1.6}
.rep-arrow{color:var(--muted);font-size:20px}
.ic-red{background:rgba(255,69,58,.18);color:var(--red)}.ic-amber{background:rgba(255,214,10,.15);color:var(--amber)}.ic-green{background:rgba(0,230,118,.15);color:var(--green)}.ic-pink{background:rgba(255,55,95,.18);color:var(--pink)}.ic-blue{background:rgba(10,132,255,.18);color:var(--blue)}.ic-orange{background:rgba(255,159,10,.18);color:var(--orange)}
.bl-red{border-left:3px solid var(--red)}.bl-amber{border-left:3px solid var(--amber)}.bl-green{border-left:3px solid var(--green)}.bl-pink{border-left:3px solid var(--pink)}.bl-blue{border-left:3px solid var(--blue)}.bl-orange{border-left:3px solid var(--orange)}

.progress-wrap{padding:10px 16px 0;flex-shrink:0}
.progress-track{height:3px;background:var(--border);border-radius:2px}
.progress-fill{height:3px;border-radius:2px;transition:width .3s ease}
.progress-label{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:5px;text-align:right}

.step-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative}
.step-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);flex-shrink:0}
.step-card-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.step-letter{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;width:36px;text-align:center;flex-shrink:0;line-height:1;margin-top:2px}
.step-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.step-value{font-size:15px;color:var(--text);word-break:break-word}
.step-value.empty{color:var(--muted);font-size:13px}
.step-legend{font-size:11px;color:var(--muted);padding:10px 16px 0;line-height:1.6}

.opts-grid{display:grid;gap:8px;padding:12px 14px 14px;grid-template-columns:1fr 1fr}
.opts-grid.cols3{grid-template-columns:1fr 1fr 1fr}.opts-grid.cols1{grid-template-columns:1fr}
.opt-btn{background:#252525;border:1.5px solid var(--border);border-radius:10px;padding:14px 8px;font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--text);cursor:pointer;text-align:center;line-height:1.3;min-height:60px;display:flex;align-items:center;justify-content:center}
.opt-btn:active{background:#333}
.opt-btn.selected{border-color:var(--accent,#fff);background:rgba(255,255,255,.09)}

.gps-btn{margin:12px 14px 4px;width:calc(100% - 28px);background:rgba(10,132,255,.15);border:1.5px solid var(--blue);border-radius:10px;padding:16px;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.gps-btn:active{background:rgba(10,132,255,.3)}
.gps-btn.loading{opacity:.6}
.gps-btn.success{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green);font-size:12px}
.gps-msg{margin:0 14px 8px;font-size:11px;color:var(--amber);line-height:1.6}

.free-input-wrap{padding:0 14px 14px}
.free-input{width:100%;background:#252525;border:1.5px solid var(--border);border-radius:10px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:16px;padding:14px;outline:none;resize:none;min-height:54px}
.free-input:focus{border-color:#666}
.free-input::placeholder{color:#666;font-size:13px}

.el-box{padding:0 14px 4px}
.el-sec{padding:10px 0;border-bottom:1px solid var(--border)}
.el-sec:last-child{border-bottom:none}
.el-title{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
.el-row{display:flex;align-items:center;gap:8px}
.el-status{flex:1;font-size:13px;word-break:break-all;min-width:0}
.el-mini{width:48px;height:48px;border-radius:10px;background:#252525;border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0}
.el-heading{font-family:'Oswald',sans-serif;font-size:52px;font-weight:700;text-align:center;line-height:1.1;color:var(--accent,#fff)}
.el-acc{text-align:center;font-size:11px;color:var(--muted);min-height:16px}
.el-big{width:100%;margin:8px 0 0;background:rgba(10,132,255,.15);border:1.5px solid var(--blue);border-radius:10px;padding:16px;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--blue);cursor:pointer}
.el-big.lock{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green)}
.el-big:active{opacity:.7}
.el-hint{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0}
.el-warn{font-size:11px;color:var(--amber);line-height:1.6;min-height:14px}
.el-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.el-lbl{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
.el-in{width:100%;background:#252525;border:1.5px solid var(--border);border-radius:10px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:16px;padding:12px;outline:none;min-height:50px}
.el-in:focus{border-color:#666}

.opts-grid.cols4{grid-template-columns:repeat(4,1fr)}
.el-chips{padding:10px 0 0 !important;gap:6px !important}
.el-chips .opt-btn{min-height:48px;font-size:13px;padding:6px 2px}
.el-headwrap{flex:0 0 40%}
.el-row .el-big{margin:0;flex:1;padding:14px 6px;font-size:14px}
.el-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.el-grid3 .el-in{padding:12px 8px}
.el-link{background:none;border:none;color:var(--blue);font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0}
.el-result{margin-top:4px;padding:12px;border-radius:10px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.3);color:var(--green);font-size:14px;line-height:1.6;word-break:break-word}

.nav-bar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-shrink:0;background:var(--bg);border-top:1px solid var(--border)}
.btn-prev{width:58px;height:58px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-prev:active{background:#333}.btn-prev:disabled{opacity:.25}
.btn-next{flex:1;height:58px;border-radius:12px;background:var(--green);border:none;font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;color:#000;cursor:pointer}
.btn-next:active{opacity:.85}.btn-next.last{background:var(--amber)}

.summary-list{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.sum-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);cursor:pointer}
.sum-row:active{background:#252525}
.sum-ltr{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;width:22px;flex-shrink:0;text-align:center}
.sum-lbl{font-size:10px;color:var(--muted);letter-spacing:1px}
.sum-val{font-size:12px;color:var(--text);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-val.empty{color:var(--muted);font-style:italic}
.sum-edit{margin-left:auto;font-size:12px;color:var(--muted);flex-shrink:0}

.preview-body{flex:1;overflow-y:auto;padding:16px;min-height:0}
.preview-box{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;font-size:15px;line-height:2;color:var(--green);white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.preview-meta{font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center;margin-bottom:16px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-btn{border-radius:12px;padding:22px 10px;border:none;cursor:pointer;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;display:flex;flex-direction:column;align-items:center;gap:6px}
.action-btn:active{opacity:.8}.action-btn .icon{font-size:26px}
.action-btn.sms{background:var(--amber);color:#000}
.action-btn.copy{background:#1e2e24;color:var(--green);border:1px solid var(--green)}
.action-btn.edit,.action-btn.new{background:var(--card);color:var(--muted);border:1px solid var(--border);font-size:12px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:12px 28px;border-radius:30px;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

/* naktinis režimas: viskas tampa tik raudona, saugo nakties regą */
#night-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#cc0000;mix-blend-mode:multiply;pointer-events:none;z-index:99999}
body.night #night-overlay{display:block}
/* filtras palieka tik raudoną kanalą, todėl žalią ir mėlyną perkeliam į raudonus atspalvius */
body.night{--green:#ff3b30;--blue:#ff7a6b;--muted:#c06a60}
</style>
<script>
// Lightweight WGS84 -> MGRS conversion
(function(global){
  var NUM_100K_SETS=6, SET_ORIGIN_COLUMN_LETTERS='AJSAJS', SET_ORIGIN_ROW_LETTERS='AFAFAF';
  var A=65,I=73,O=79,V=86,Z=90;
  function get100kSetForZone(i){var s=i%NUM_100K_SETS;return s===0?NUM_100K_SETS:s;}
  function getLetter100kID(column,row,parm){
    var index=parm-1,colOrigin=SET_ORIGIN_COLUMN_LETTERS.charCodeAt(index),rowOrigin=SET_ORIGIN_ROW_LETTERS.charCodeAt(index);
    var colInt=colOrigin+column-1,rowInt=rowOrigin+row,rollover=false;
    if(colInt>Z){colInt=colInt-Z+A-1;rollover=true;}
    if(colInt===I||(colOrigin<I&&colInt>I)||((colInt>I||colOrigin<I)&&rollover)){colInt++;}
    if(colInt===O||(colOrigin<O&&colInt>O)||((colInt>O||colOrigin<O)&&rollover)){colInt++;if(colInt===I)colInt++;}
    if(colInt>Z){colInt=colInt-Z+A-1;}
    if(rowInt>V){rowInt=rowInt-V+A-1;rollover=true;}else{rollover=false;}
    if((rowInt===I)||((rowOrigin<I)&&(rowInt>I))||(((rowInt>I)||(rowOrigin<I))&&rollover)){rowInt++;}
    if((rowInt===O)||((rowOrigin<O)&&(rowInt>O))||(((rowInt>O)||(rowOrigin<O))&&rollover)){rowInt++;if(rowInt===I)rowInt++;}
    if(rowInt>V){rowInt=rowInt-V+A-1;}
    return String.fromCharCode(colInt)+String.fromCharCode(rowInt);
  }
  function encode(utm,accuracy){
    var seasting='00000'+utm.easting,snorthing='00000'+utm.northing;
    return utm.zoneNumber+utm.zoneLetter+getLetter100kID(
      Math.floor(utm.easting/100000),Math.floor(utm.northing/100000)%20,
      get100kSetForZone(utm.zoneNumber)
    )+(seasting.substr(seasting.length-5)).substr(0,accuracy)+(snorthing.substr(snorthing.length-5)).substr(0,accuracy);
  }
  function latLonToUtm(lat,lon){
    var Lat=lat,Long=lon,a=6378137.0,eccSquared=0.00669438,k0=0.9996;
    var LongOrigin,eccPrimeSquared,N,T,C,A2,M;
    var LatRad=Lat*Math.PI/180,LongRad=Long*Math.PI/180;
    var ZoneNumber=Math.floor((Long+180)/6)+1;
    if(Lat>=56.0&&Lat<64.0&&Long>=3.0&&Long<12.0)ZoneNumber=32;
    if(Lat>=72.0&&Lat<84.0){if(Long>=0.0&&Long<9.0)ZoneNumber=31;else if(Long>=9.0&&Long<21.0)ZoneNumber=33;else if(Long>=21.0&&Long<33.0)ZoneNumber=35;else if(Long>=33.0&&Long<42.0)ZoneNumber=37;}
    LongOrigin=(ZoneNumber-1)*6-180+3;
    var LongOriginRad=LongOrigin*Math.PI/180;
    eccPrimeSquared=eccSquared/(1-eccSquared);
    N=a/Math.sqrt(1-eccSquared*Math.sin(LatRad)*Math.sin(LatRad));
    T=Math.tan(LatRad)*Math.tan(LatRad);C=eccPrimeSquared*Math.cos(LatRad)*Math.cos(LatRad);
    A2=Math.cos(LatRad)*(LongRad-LongOriginRad);
    M=a*((1-eccSquared/4-3*eccSquared*eccSquared/64-5*eccSquared*eccSquared*eccSquared/256)*LatRad-(3*eccSquared/8+3*eccSquared*eccSquared/32+45*eccSquared*eccSquared*eccSquared/1024)*Math.sin(2*LatRad)+(15*eccSquared*eccSquared/256+45*eccSquared*eccSquared*eccSquared/1024)*Math.sin(4*LatRad)-(35*eccSquared*eccSquared*eccSquared/3072)*Math.sin(6*LatRad));
    var UTMEasting=k0*N*(A2+(1-T+C)*A2*A2*A2/6+(5-18*T+T*T+72*C-58*eccPrimeSquared)*A2*A2*A2*A2*A2/120)+500000.0;
    var UTMNorthing=k0*(M+N*Math.tan(LatRad)*(A2*A2/2+(5-T+9*C+4*C*C)*A2*A2*A2*A2/24+(61-58*T+T*T+600*C-330*eccPrimeSquared)*A2*A2*A2*A2*A2*A2/720));
    if(Lat<0)UTMNorthing+=10000000.0;
    var ZoneLetter='CDEFGHJKLMNPQRSTUVWXX'.charAt(Math.floor((Lat+80)/8));
    return{northing:Math.floor(UTMNorthing),easting:Math.floor(UTMEasting),zoneLetter:ZoneLetter,zoneNumber:ZoneNumber};
  }
  global.latLonToMGRS=function(lat,lon,precision){
    precision=precision||5;
    return encode(latLonToUtm(lat,lon),precision);
  };
})(window);
</script>
</head>
<body>

<div class="screen active" id="screen-select">
  <div class="topbar">
    <div><div class="topbar-title">KERNIUS RODŽER</div><div class="topbar-sub">📡 PASIRINK SITUACIJĄ</div></div>
    <div class="top-right"><button class="night-btn" onclick="toggleNight()">🌙</button><div class="clock" id="clock">00:00</div></div>
  </div>
  <div class="report-list">
    <button class="rep-btn bl-red" onclick="startReport('contactrep')"><div class="rep-icon ic-red">!</div><div class="rep-text"><div class="rep-code" style="color:var(--red)">CONTACTREP</div><div class="rep-desc">Kontaktas su priešu · pirmoji sekundė<br>Kryptis · Atstumas · Aprašymas</div></div><div class="rep-arrow">›</div></button>
    <button class="rep-btn bl-amber" onclick="startReport('saluto')"><div class="rep-icon ic-amber">S</div><div class="rep-text"><div class="rep-code" style="color:var(--amber)">SALUTO</div><div class="rep-desc">Priešo stebėjimas · žvalgyba<br>Dydis · Veikla · Vieta (kompasas) · Įranga</div></div><div class="rep-arrow">›</div></button>
    <button class="rep-btn bl-green" onclick="startReport('lace')"><div class="rep-icon ic-green">L</div><div class="rep-text"><div class="rep-code" style="color:var(--green)">LACE</div><div class="rep-desc">Savų resursai · po susirėmimo<br>Vanduo · Šaudmenys · Aukos · Įranga</div></div><div class="rep-arrow">›</div></button>
    <button class="rep-btn bl-pink" onclick="startReport('medevac')"><div class="rep-icon ic-pink">✚</div><div class="rep-text"><div class="rep-code" style="color:var(--pink)">MEDEVAC</div><div class="rep-desc">Medicininė evakuacija · 9 eilutės<br>Naudok kai yra sužeistų</div></div><div class="rep-arrow">›</div></button>
    <button class="rep-btn bl-orange" onclick="startReport('mist')"><div class="rep-icon ic-orange">M</div><div class="rep-text"><div class="rep-code" style="color:var(--orange)">MIST</div><div class="rep-desc">Sužeistojo perdavimas<br>Mechanizmas · Sužeidimai · Požymiai · Gydymas</div></div><div class="rep-arrow">›</div></button>
    <button class="rep-btn bl-blue" onclick="startReport('sitrep')"><div class="rep-icon ic-blue">≡</div><div class="rep-text"><div class="rep-code" style="color:var(--blue)">SITREP</div><div class="rep-desc">Situacijos ataskaita · periodiškai<br>Vieta · Nuveikta · Planas · Poreikiai</div></div><div class="rep-arrow">›</div></button>
  </div>
</div>

<div class="screen" id="screen-form">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('select')">‹</button>
    <div><div class="topbar-title" id="form-title"></div><div class="topbar-sub" id="form-sub"></div></div>
    <div class="top-right"><button class="night-btn" onclick="toggleNight()">🌙</button><div class="clock" id="clock2">00:00</div></div>
  </div>
  <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div><div class="progress-label" id="prog-label"></div></div>
  <div class="step-area" id="step-area"></div>
  <div class="nav-bar"><button class="btn-prev" id="btn-prev" onclick="prevStep()">‹</button><button class="btn-next" id="btn-next" onclick="nextStep()">TOLIAU ›</button></div>
</div>

<div class="screen" id="screen-preview">
  <div class="topbar">
    <button class="back-btn" onclick="goTo('form')">‹</button>
    <div><div class="topbar-title">PRANEŠIMAS</div><div class="topbar-sub">PARUOŠTAS SIŲSTI</div></div>
    <div class="top-right"><button class="night-btn" onclick="toggleNight()">🌙</button></div>
  </div>
  <div class="preview-body">
    <div class="preview-box" id="preview-box"></div>
    <div class="preview-meta" id="preview-meta"></div>
    <div class="action-grid">
      <button class="action-btn sms" onclick="sendSms()"><span class="icon">✉</span>SMS</button>
      <button class="action-btn copy" onclick="copyMsg()"><span class="icon">⧉</span>KOPIJUOTI</button>
      <button class="action-btn edit" onclick="goTo('form')"><span class="icon">✎</span>TAISYTI</button>
      <button class="action-btn new" onclick="goTo('select')"><span class="icon">+</span>NAUJA</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">NUKOPIJUOTA ✓</div>
<div id="night-overlay"></div>

<script>
/* ───────── pagalbinės ───────── */
const UNITS=['CHARLI 1','CHARLI 2','CHARLI 3','DELTA 1','DELTA 2','DELTA 3'];
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function pad(n){return (n<10?'0':'')+n;}

/* DTG pagal NATO: DDHHMM + laiko juostos raidė + MMM YY (pvz. 181315C OCT 26) */
function dtgNow(){
  const d=new Date(),offMin=-d.getTimezoneOffset();
  let L,Y,Mo,D,h,mi;
  if(offMin%60===0&&offMin>=-720&&offMin<=720){
    const off=offMin/60;
    L=off>=0?'ZABCDEFGHIKLM'.charAt(off):'NOPQRSTUVWXY'.charAt(-off-1);
    Y=d.getFullYear();Mo=d.getMonth();D=d.getDate();h=d.getHours();mi=d.getMinutes();
  }else{
    L='Z';Y=d.getUTCFullYear();Mo=d.getUTCMonth();D=d.getUTCDate();h=d.getUTCHours();mi=d.getUTCMinutes();
  }
  return pad(D)+pad(h)+pad(mi)+L+' '+MON[Mo]+' '+pad(Y%100);
}

/* magnetinė deklinacija Lietuvai (WMM2025, epocha 2026.8), bilinijinė interpoliacija */
const DECL={lat0:53.8,dlat:0.7,lon0:20.8,dlon:1.5,v:[[7.33, 7.72, 8.09, 8.47, 8.83], [7.49, 7.89, 8.29, 8.67, 9.05], [7.66, 8.07, 8.49, 8.89, 9.29], [7.83, 8.26, 8.69, 9.11, 9.52], [8.0, 8.45, 8.9, 9.34, 9.77]]};
function declAt(lat,lon){
  const V=DECL.v,ny=V.length,nx=V[0].length;
  const fy=Math.min(Math.max((lat-DECL.lat0)/DECL.dlat,0),ny-1),fx=Math.min(Math.max((lon-DECL.lon0)/DECL.dlon,0),nx-1);
  const y0=Math.floor(fy),x0=Math.floor(fx),y1=Math.min(y0+1,ny-1),x1=Math.min(x0+1,nx-1),ty=fy-y0,tx=fx-x0;
  const a=V[y0][x0]*(1-tx)+V[y0][x1]*tx,b=V[y1][x0]*(1-tx)+V[y1][x1]*tx;
  return Math.round((a*(1-ty)+b*ty)*10)/10;
}
function inLT(lat,lon){return lat>=53.3&&lat<=57.1&&lon>=20.3&&lon<=27.5;}

/* taško paieška pagal tikrąjį azimutą ir atstumą (metrais) */
function destPoint(lat,lon,brg,dist){
  /* WGS84 elipsoidas, vidurinės platumos kreivumo spinduliai (paklaida <0,1 m iki kelių km) */
  const a=6378137.0,e2=0.00669437999014,b=brg*Math.PI/180,p1=lat*Math.PI/180;
  let pm=p1,dlat=0,dlon=0;
  for(let k=0;k<3;k++){
    const s=Math.sin(pm),w=1-e2*s*s,M=a*(1-e2)/Math.pow(w,1.5),Nn=a/Math.sqrt(w);
    dlat=dist*Math.cos(b)/M;dlon=dist*Math.sin(b)/(Nn*Math.cos(pm));pm=p1+dlat/2;
  }
  return [(p1+dlat)*180/Math.PI,((lon+dlon*180/Math.PI+540)%360)-180];
}

function smsInfo(t){
  const gsm=/^[A-Za-z0-9 \r\n@£$¥èéùìòÇØøÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ!"#¤%&'()*+,\-.\/:;<=>?¡ÄÖÑÜ§¿äöñüà]*$/.test(t);
  const n=t.length;let parts;
  if(gsm)parts=n<=160?1:Math.ceil(n/153);else parts=n<=70?1:Math.ceil(n/67);
  return {n:n,parts:parts,gsm:gsm};
}

let compassOff=null,compassTimer=null,compassGranted=false;
function stopCompass(){
  if(compassOff){compassOff();compassOff=null;}
  if(compassTimer){clearTimeout(compassTimer);compassTimer=null;}
}
function compassStart(onHeading,onNeedPermission){
  stopCompass();
  const handler=function(e){
    let h=null,acc=null;
    if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)){
      h=e.webkitCompassHeading;
      if(typeof e.webkitCompassAccuracy==='number'&&e.webkitCompassAccuracy>=0)acc=e.webkitCompassAccuracy;
    }else if(e.alpha!=null&&(e.absolute===true||e.type==='deviceorientationabsolute')){
      h=(360-e.alpha)%360;
    }
    if(h!=null)onHeading(h,acc);
  };
  const attach=function(){
    window.addEventListener('deviceorientationabsolute',handler,true);
    window.addEventListener('deviceorientation',handler,true);
    compassOff=function(){
      window.removeEventListener('deviceorientationabsolute',handler,true);
      window.removeEventListener('deviceorientation',handler,true);
    };
  };
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'&&!compassGranted){
    try{
      DeviceOrientationEvent.requestPermission().then(function(s){
        if(s==='granted'){compassGranted=true;attach();}else onNeedPermission('denied');
      }).catch(function(){onNeedPermission('gesture');});
    }catch(e){onNeedPermission('gesture');}
  }else attach();
}

  distIn.oninput=function(){const v=parseFloat(distIn.value);enemy.dist=v>0?Math.round(v):null;refreshChips();compute();};
  azIn.oninput=function(){const v=parseFloat(azIn.value);enemy.az=isNaN(v)?null:((Math.round(v)%360)+360)%360;compute();};
  declIn.oninput=function(){const v=parseFloat(declIn.value);enemy.decl=isNaN(v)?0:v;showTrue();};
  lockBtn.onclick=function(){
    if(magH==null){warnEl.textContent='⚠ Dar nėra kompaso rodmens – įvesk azimutą ranka';return;}
    enemy.az=Math.round((magH+enemy.decl+360)%360)%360;azIn.value=enemy.az;
    lockBtn.textContent='✓ '+enemy.az+'° · IŠ NAUJO';compute();
  };
  manualBtn.onclick=function(){const w=manualWrap();showManual(!w||w.style.display==='none');};
  permBtn.onclick=startC;
  gpsBtn.onclick=gpsGo;
  gpsGo();startC();
}

/* ───────── žingsnių piešimas ───────── */
function renderStep(){
  stopCompass();
  const r=REPORTS[currentId],fields=r.fields,total=fields.length,i=currentStep,f=fields[i];
  const pf=document.getElementById('prog-fill');
  pf.style.width=((i+1)/total*100)+'%';pf.style.background=accentColor;
  document.getElementById('prog-label').textContent=(i+1)+' / '+total;
  document.getElementById('btn-prev').disabled=(i===0);
  const nb=document.getElementById('btn-next');
  nb.textContent=i===total-1?'GENERUOTI ›':'TOLIAU ›';
  nb.className=i===total-1?'btn-next last':'btn-next';

  const area=document.getElementById('step-area');area.innerHTML='';

  if(i>0){
    const sumDiv=document.createElement('div');sumDiv.className='summary-list';
    for(let j=0;j<i;j++){
      const pj=fields[j],val=formData[pj.key];
      const row=document.createElement('div');row.className='sum-row';
      const ltr=document.createElement('div');ltr.className='sum-ltr';ltr.style.color=accentColor;ltr.textContent=pj.letter;
      const mid=document.createElement('div');mid.style.cssText='flex:1;min-width:0';
      const lb=document.createElement('div');lb.className='sum-lbl';lb.textContent=pj.label;
      const vl=document.createElement('div');vl.className='sum-val'+(val?'':' empty');vl.textContent=val||'—';
      mid.appendChild(lb);mid.appendChild(vl);
      const ed=document.createElement('div');ed.className='sum-edit';ed.textContent='✎';
      row.appendChild(ltr);row.appendChild(mid);row.appendChild(ed);
      row.onclick=function(){currentStep=j;renderStep();};
      sumDiv.appendChild(row);
    }
    area.appendChild(sumDiv);
  }

  const card=document.createElement('div');card.className='step-card';card.style.setProperty('--accent',accentColor);
  const head=document.createElement('div');head.className='step-card-head';
  head.innerHTML='<div class="step-letter"></div><div style="flex:1;min-width:0"><div class="step-label"></div><div class="step-value"></div></div>';
  const letEl=head.querySelector('.step-letter');letEl.style.color=accentColor;letEl.textContent=f.letter;
  head.querySelector('.step-label').textContent=f.label;
  const valEl=head.querySelector('.step-value');
  const hintTxt=f.hint||'Pasirink arba įvesk';
  function paintVal(){const v=formData[f.key]||'';valEl.textContent=v||hintTxt;valEl.classList.toggle('empty',!v);}
  paintVal();card.appendChild(head);
  function updateVal(v){formData[f.key]=v;paintVal();}

  if(f.legend){const lg=document.createElement('div');lg.className='step-legend';lg.textContent=f.legend;card.appendChild(lg);}

  const chipBtns=[];
  function tokens(){return (formData[f.key]||'').split(', ').filter(Boolean);}
  function refreshSel(){
    const tk=tokens();
    chipBtns.forEach(function(c){c.btn.classList.toggle('selected',f.multi?tk.indexOf(c.val)>=0:formData[f.key]===c.val);});
  }

  if(f.type==='enemyloc'){
    buildEnemyLoc(card,updateVal);
  }else{
    if(f.gps){
      const gb=document.createElement('button');gb.className='gps-btn';gb.textContent='📍 GAUTI GPS KOORDINATES (MGRS)';
      const msg=document.createElement('div');msg.className='gps-msg';
      gb.onclick=function(){
        gb.textContent='⏳ NUSTATOMA…';gb.classList.add('loading');msg.textContent='';
        if(!navigator.geolocation){gb.classList.remove('loading');gb.textContent='📍 BANDYTI DAR KARTĄ';msg.textContent='⚠ GPS nepasiekiamas – įvesk MGRS ranka.';return;}
        navigator.geolocation.getCurrentPosition(function(p){
          const mg=latLonToMGRS(p.coords.latitude,p.coords.longitude,5);
          updateVal(mg);const fi=card.querySelector('.free-input');if(fi)fi.value=mg;
          gb.className='gps-btn success';gb.textContent='✓ '+mg;
        },function(){
          gb.classList.remove('loading');gb.textContent='📍 BANDYTI DAR KARTĄ';
          msg.textContent='⚠ GPS nepavyko. Patikrink leidimą (Nustatymai → Safari → Vieta) arba įvesk MGRS ranka.';
        },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
      };
      card.appendChild(gb);card.appendChild(msg);
    }
    if(f.opts&&f.opts.length){
      const grid=document.createElement('div');
      grid.className='opts-grid'+(f.cols===3?' cols3':f.cols===1?' cols1':'');
      f.opts.forEach(function(opt){
        const val=typeof opt==='object'?opt.value:opt,lbl=typeof opt==='object'?opt.label:opt;
        const btn=document.createElement('button');btn.className='opt-btn';btn.style.color=accentColor;btn.textContent=lbl;
        btn.onclick=function(){
          const fi=card.querySelector('.free-input');
          if(f.multi){
            const arr=tokens(),ix=arr.indexOf(val);
            if(ix>=0)arr.splice(ix,1);else arr.push(val);
            const v=arr.join(', ');updateVal(v);if(fi)fi.value=v;refreshSel();return;
          }
          let v=val;if(f.key==='time'&&val==='DABAR')v=dtgNow();
          updateVal(v);if(fi)fi.value=v;refreshSel();
          if(!f.free)setTimeout(function(){nextStep();},200);
        };
        chipBtns.push({btn:btn,val:val});grid.appendChild(btn);
      });
      card.appendChild(grid);refreshSel();
    }
  }

  if(f.free){
    const wrap=document.createElement('div');wrap.className='free-input-wrap';
    const inp=f.area?document.createElement('textarea'):document.createElement('input');
    inp.className='free-input';if(f.area)inp.rows=2;else inp.type='text';
    inp.placeholder=f.hint||'Laisvas tekstas…';inp.value=formData[f.key]||'';
    inp.oninput=function(){updateVal(inp.value);refreshSel();};
    if(f.type==='enemyloc')wrap.style.display='none';
    wrap.appendChild(inp);card.appendChild(wrap);
  }

  area.appendChild(card);
  setTimeout(function(){
    if(card.offsetHeight>area.clientHeight*0.7)area.scrollTop=Math.max(card.offsetTop-10,0);
    else area.scrollTop=area.scrollHeight;
  },50);
}

function nextStep(){
  const r=REPORTS[currentId];
  if(currentStep<r.fields.length-1){currentStep++;renderStep();}else generate();
}
function prevStep(){if(currentStep>0){currentStep--;renderStep();}}

function generate(){
  const r=REPORTS[currentId],text=r.build(formData,dtgNow());
  document.getElementById('preview-box').textContent=text;
  const s=smsInfo(text);
  document.getElementById('preview-meta').textContent=s.n+' simbolių · '+s.parts+' SMS'+(s.gsm?'':' (Unicode)');
  goTo('preview');
}
function sendSms(){window.location.href='sms:?body='+encodeURIComponent(document.getElementById('preview-box').textContent);}
function copyMsg(){
  navigator.clipboard.writeText(document.getElementById('preview-box').textContent).then(function(){
    const t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);
  });
}

/* ───────── naktinis režimas, laikrodis, offline ───────── */
function toggleNight(){
  const on=document.body.classList.toggle('night');
  try{localStorage.setItem('kr_night',on?'1':'0');}catch(e){}
}
try{if(localStorage.getItem('kr_night')==='1')document.body.classList.add('night');}catch(e){}

function tick(){
  const t=new Date().toTimeString().slice(0,5);
  ['clock','clock2'].forEach(function(id){const el=document.getElementById(id);if(el)el.textContent=t;});
}
tick();setInterval(tick,10000);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
